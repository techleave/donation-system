async function cancelLeafRequest(id){if(!confirm(state.lang==='zh'?'取消這項申請並退回兌換權益？':'Cancel this request and restore its allowances?'))return;try{const r=await fetch('/api/requests',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:'cancelled'})}),d=await r.json();if(!r.ok)throw new Error(d.error);if(d.donor)ownProfile=d.donor;await loadHistory(historyOffset)}catch(e){historyError=e.message;render()}}


let treeAdoptions=[],treeAdoptionsBusy=false,treeAdoptionsLoaded=false,treeAdoptionsError='',treeCardIndex=0;
async function loadTreeAdoptions(){if(ADMIN_MODE||!state.logged||treeAdoptionsBusy)return;treeAdoptionsBusy=true;try{const r=await fetch('/api/tree-adoptions'),d=await r.json();if(!r.ok)throw new Error(d.error);const changed=!treeAdoptionsLoaded||!!treeAdoptionsError||JSON.stringify(d.adoptions)!==JSON.stringify(treeAdoptions);treeAdoptions=d.adoptions;treeAdoptionsLoaded=true;treeAdoptionsError='';if(changed&&state.view==='tree'){preserve();render()}}catch(e){treeAdoptionsError=e.message;if(state.view==='tree')render()}finally{treeAdoptionsBusy=false}}
function treeDeck(){const en=state.lang==='en',cards=treeAdoptions.flatMap(g=>g.trees.map(t=>({...t,requestId:g.requestId}))),total=treeAdoptions.reduce((n,g)=>n+g.quantity,0);if(!treeAdoptionsLoaded&&!treeAdoptionsError)return `<section class="tree-library"><h2>${en?'Your forest':'您的認養森林'}</h2><p>${en?'Loading your adopted trees…':'正在載入認養樹木…'}</p></section>`;if(treeAdoptionsError)return `<section class="tree-library"><h2>${en?'Your forest':'您的認養森林'}</h2><p role="alert">${esc(treeAdoptionsError)}</p><button onclick="loadTreeAdoptions()">${en?'Retry':'重試'}</button></section>`;if(!total)return '';treeCardIndex=Math.max(0,Math.min(treeCardIndex,cards.length-1));return `<section class="tree-library" aria-label="${en?'Your adopted trees':'您的認養樹木'}"><div class="tree-library-heading"><div><span class="impact-kicker">${en?'A living contribution':'讓善意持續成長'}</span><h2>${en?'Your forest':'您的認養森林'}</h2><p>${en?`${cards.length} of ${total} tree links ready. Your QR cards appear here as the team assigns them.`:`${total} 棵樹中，已有 ${cards.length} 個認養連結。團隊完成設定後，二維碼卡片會在此顯示。`}</p></div></div>${cards.length?`<div class="tree-stack-area"><div class="tree-stack" tabindex="0" onkeydown="if(event.key==='ArrowRight'){event.preventDefault();moveTreeCard(1)}if(event.key==='ArrowLeft'){event.preventDefault();moveTreeCard(-1)}" ontouchstart="this.dataset.touchX=event.changedTouches[0].clientX" ontouchend="const dx=event.changedTouches[0].clientX-Number(this.dataset.touchX);if(Math.abs(dx)>45)moveTreeCard(dx<0?1:-1)" aria-label="${en?'Tree cards. Use left and right arrows to switch.':'認養卡片，可用左右方向鍵切換。'}">${[2,1,0].filter(depth=>depth<cards.length).map(depth=>{const idx=(treeCardIndex+depth)%cards.length,t=cards[idx];return `<article class="tree-qr-card tree-depth-${depth}" ${depth?'aria-hidden="true" inert':''}><span class="tree-card-kicker">HKICF FOREST · BHUTAN</span><h3>${esc(t.label)||(en?'Your adopted tree':'您的認養樹木')}</h3><span class="tree-card-number">${en?'Tree':'樹木'} ${t.treeIndex}</span><img class="tree-qr" src="/api/tree-adoptions/qr?requestId=${encodeURIComponent(t.requestId)}&index=${t.treeIndex}&v=${t.revision}" alt="${en?'Scan to view this adopted tree':'掃描查看此認養樹木'}" ${depth?'loading="lazy"':''}><p>${en?'Scan to follow its growth':'掃描二維碼，追蹤樹木成長'}</p><a class="tree-open-link" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${en?'Visit your tree':'查看我的樹木'} ↗</a></article>`}).join('')}</div><div class="tree-deck-controls"><button type="button" onclick="moveTreeCard(-1)" ${cards.length<2?'disabled':''} aria-label="${en?'Previous tree':'上一棵樹'}">←</button><span role="status" aria-live="polite">${treeCardIndex+1} / ${cards.length}</span><button type="button" onclick="moveTreeCard(1)" ${cards.length<2?'disabled':''} aria-label="${en?'Next tree':'下一棵樹'}">→</button></div></div>`:`<div class="tree-waiting">${en?'Your adoption request has been received. The team will add your tree links here.':'已收到您的認養申請，團隊將在此加入每棵樹的認養連結。'}</div>`}</section>`}
function moveTreeCard(delta){const count=treeAdoptions.reduce((n,g)=>n+g.trees.length,0);if(!count)return;treeCardIndex=(treeCardIndex+delta+count)%count;preserve();render();requestAnimationFrame(()=>document.querySelector('.tree-stack')?.focus({preventScroll:true}))}

function reward(){const cat=state.view,d=state.drafts[cat]??{};const hasChoices=['airport','ticket'].includes(cat)||config.items.some(x=>x.category===cat&&x.enabled);const items=config.items.filter(x=>x.enabled&&x.category===cat&&(cat!=='ticket'||x.mode===state.ticketMode));return `<section class="panel"><button class="back" onclick="nav('home')"><svg class="back-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M12 4.5 6.5 10l5.5 5.5M7 10h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${t('back')}</span></button><h1>${t(cat)}</h1><p>${t(cat+'Desc')}</p>${cat==='tree'&&!ADMIN_MODE?treeDeck():''}<p class="notice">${allowanceText(cat)}</p>${cat==='ticket'?`<div class="chips">${['tickets','discount'].map(mode=>`<button class="${state.ticketMode===mode?'selected':''}" onclick="preserve();state.ticketMode='${mode}';render()">${t(mode)}</button>`).join('')}</div>`:''}<div class="card"><form id="rewardForm" onsubmit="event.preventDefault();sendRequest(this)">${hasChoices?items.length?items.map(item=>`<label class="item"><div><h3>${bi(item.title)}</h3><p>${bi(item.description)}</p><b>${state.lang==='zh'?'使用此項權益 1 次':'Uses one allowance for this reward'}</b></div><input type="radio" name="rewardId" value="${esc(item.id)}" ${d.rewardId===item.id?'checked':''} required aria-label="${bi(item.title)}"></label>`).join(''):`<div class="empty">${t('none')}</div>`:''}${isLeaf(cat)?leafForm():config.fields[cat].filter(f=>!['displayName','name','contact','customerName','customerEmail','contactName','contactEmail','phone','email'].includes(f.key)&&!(cat==='tree'&&f.key==='leaves')).map(field).join('')}${cat==='tree'?treeQuantity():''}${!ADMIN_MODE&&ownProfileStatus!=='ready'?`<div class="notice">${state.lang==='zh'?'提交時會使用你的 Profile 資料，請先登入個人 Profile。':'Your Profile is used for submission. Please sign in to your Profile first.'} <a href="/signin?return_to=%2F%3Fprofile%3D1" target="_top">${state.lang==='zh'?'登入':'Sign in'}</a></div>`:''}<div class="notice">${t('submissionNote')}</div><p id="saveError" class="login-error" role="alert"></p><button class="primary" ${(hasChoices&&!items.length)||(!ADMIN_MODE&&(ownProfileStatus!=='ready'||allowance(cat).remaining<1))?'disabled':''}>${t('submit')}</button></form></div></section>`}
async function sendRequest(form){if(isLeaf(state.view)){if(leafUploading)return;const name=form.querySelector('[name=leafName]');if(name&&!validateLeafName(name)){form.reportValidity();return}if(form.leafMode.value==='logo'&&!form.leafLogo.value){$('#saveError').textContent=state.lang==='zh'?'請先上傳 Logo':'Upload a logo first';return}}preserve();const button=form.querySelector('.primary');button.disabled=true;const values=Object.fromEntries(new FormData(form));try{const res=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:requestIds[state.view]??(requestIds[state.view]=crypto.randomUUID()),category:state.view,itemId:values.rewardId,fields:values})});const data=await res.json();if(!res.ok)throw new Error(data.error);if(data.donor){ownProfile=data.donor;ownProfileStatus='ready'}if(state.view==='tree')loadTreeAdoptions();delete requestIds[state.view];state.requests.unshift({...data,type:state.view});state.drafts[state.view]={};nav('history')}catch(e){$('#saveError').textContent=e.message;button.disabled=false}}
let historyOffset=0,historyHasMore=false,historyLoading=false,historyError='';
async function loadHistory(offset=0){if(ADMIN_MODE||!state.logged)return;historyLoading=true;historyError='';historyOffset=offset;render();try{const r=await fetch('/api/requests?offset='+offset),d=await r.json();if(!r.ok)throw new Error(d.error);state.requests=d.requests.map(r=>({...r,time:r.submitted_at,type:r.category}));historyHasMore=d.hasMore}catch(e){historyError=e.message}finally{historyLoading=false;if(state.view==='history')render()}}
function history(){return `<section class="panel"><button class="back" onclick="nav('home')"><svg class="back-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M12 4.5 6.5 10l5.5 5.5M7 10h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${t('back')}</span></button><h1>${t('history')}</h1><p>${t('historyDesc')}</p><div class="card">${state.requests.length?state.requests.map(r=>`<div class="item"><div><h3>${t(r.type)}</h3>${Object.values(r.fields).map(requestField).join('')}<p>${t('submitted')}: ${new Date(r.time).toLocaleString(state.lang==='zh'?'zh-HK':'en-GB')}</p></div><div><span class="pill">${requestStatus(r.status)}</span>${isLeaf(r.type)&&r.status==='pending'?`<button type="button" class="leaf-cancel" onclick="cancelLeafRequest('${r.id}')">${state.lang==='zh'?'取消申請':'Cancel request'}</button>`:''}</div></div>`).join(''):`<div class="empty">${t('empty')}</div>`}<div class="points-pager"><button onclick="loadHistory(${Math.max(0,historyOffset-50)})" ${historyOffset===0?'disabled':''}>‹</button><button onclick="loadHistory(${historyOffset+50})" ${!historyHasMore?'disabled':''}>›</button></div><p class="muted" id="history-status">${historyLoading?(state.lang==='zh'?'載入中…':'Loading…'):esc(historyError)}</p></div></section>`}
function theme(){const th=config.theme;let style=$('#cms-theme');if(!style){style=document.createElement('style');style.id='cms-theme';document.head.append(style)}style.textContent=`:root{--reward-primary:${th.primary};--reward-surface:${th.surface};--reward-radius:${th.radius}px}body,.signin,.mobilebar{background:${th.background}}.prompt,.card,.signin-card{background:${th.surface};border-radius:${th.radius}px}.side,.primary,.chips button.selected,.option.selected{background:${th.primary}}.hello,.panel h1,.signin-intro h1,.signin-card h2,.brand,.field label,.item h3,.balance strong{color:${th.primary};-webkit-text-fill-color:${th.primary}}.prompt,.signin-card{border-top-color:${th.primary}}.pill,.signin-mark,.icon{background:${th.accent}}.primary{color:white;box-shadow:4px 4px 0 ${th.accent}}.side .brand{color:white}.main{max-width:${th.width}px}.choice strong,.item b,.back,.chev,.eyebrow,.prompt h2,.summary strong{color:${th.primary}}.choice:hover{border-color:${th.primary};box-shadow:5px 5px 0 ${th.accent}}.hello,.panel h1,.signin-intro h1,.signin-card h2{font-family:${th.font==='serif'?'Georgia,serif':'Arial,sans-serif'}}${th.navigation==='top'?'.shell{display:block}.side{position:relative;height:auto;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;padding:18px 28px}.side .nav{display:flex;gap:8px;flex:1}.side .nav button{width:auto;white-space:nowrap}.sidefoot{margin:0}.side .signout{margin:0}.sidefoot>br{display:none}@media(max-width:760px){.side{display:none}}':''}.admin-link{display:block;margin-top:22px;color:${th.primary};font-size:14px}`}
let observer;function effects(){observer?.disconnect();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');observer.unobserve(e.target)}}),{threshold:.06});document.querySelectorAll('.choice,.reward-tile,.panel,.prompt,.hello,.signin-card').forEach(e=>{e.classList.add('reveal');observer.observe(e)})}
function donationFloat(){if(ADMIN_MODE)return '';return `<a class="donation-float" href="https://hkicf.com/plant-a-choral-seed-fundraising-campaign/" target="_blank" rel="noopener noreferrer" aria-label="${state.lang==='zh'?'立即捐款支持合唱教育（在新分頁開啟）':'Donate Now to support choral education (opens in a new tab)'}"><img src="/assets/donation-music-note-v2.png" alt="" aria-hidden="true"></a>`}
function render(){applyRewardRules();document.documentElement.lang=state.lang==='zh'?'zh-HK':'en';theme();$('#app').innerHTML=(ADMIN_MODE?adminToolbar():'')+(state.logged?shell(state.view==='home'?home():state.view==='history'?history():state.view==='profile'?ownProfileView():state.view==='password'?changePasswordView():reward()):login())+donationFloat();requestAnimationFrame(()=>{effects();animateImpact()})}
async function boot(){try{if(ADMIN_MODE){const r=await fetch('/api/auth/me'),d=await r.json();if(d.user?.role!=='admin'){location.href=sessionTabUrl('/signin?return_to=%2Fadmin');return}}const preview=new URLSearchParams(location.search).get('preview')==='1';const res=await fetch(preview?'/api/config?admin=1':'/api/config');const d=await res.json();if(!res.ok)throw new Error(d.error);config=preview?d.draft:d.config;revision=d.revision;if(preview||ADMIN_MODE)state.logged=true;if(!ADMIN_MODE&&new URLSearchParams(location.search).get('profile')==='1'){state.logged=true;state.view='profile'}render();if(!ADMIN_MODE){const session=await fetch('/api/auth/me');const identity=await session.json();if(identity.user){state.logged=true;await loadOwnProfile();loadTreeAdoptions();render()}else loadOwnProfile()}}catch(e){$('#app').innerHTML=`<div class="card" style="margin:50px auto;max-width:600px"><h1>暫時未能載入 / Unable to load</h1><p>${esc(e.message)}</p><button class="primary" onclick="boot()">重試 / Retry</button></div>`}}
let ownProfile=null,ownProfileStatus='loading',ownProfileError='';
function ownProfileView(){const en=state.lang==='en';let content;if(ownProfileStatus==='signin')content=`<p>${en?'Sign in to view your own profile. Use the same email as your donor record.':'請登入查看自己的 Profile，登入電郵須與 Donor 記錄一致。'}</p><a class="primary profile-signin-link" href="/signin?return_to=%2F%3Fprofile%3D1" target="_top">${en?'Sign in':'使用電郵登入'}</a>`;else if(ownProfileStatus==='missing')content=`<p>${en?'No donor profile is linked to this signed-in email. Please contact the administrator to add or check your record.':'此登入電郵未有對應的 Donor Profile，請聯絡管理者新增或核對記錄。'}</p>`;else if(ownProfileStatus==='error')content=`<p role="alert">${esc(ownProfileError)}</p><button class="primary" onclick="loadOwnProfile()">${en?'Retry':'重試'}</button>`;else if(!ownProfile)content=`<p>${en?'Loading profile…':'載入 Profile 中…'}</p>`;else{const d=ownProfile;const item=(label,value)=>`<div class="profile-value"><span>${label}</span><strong>${esc(value)||'—'}</strong></div>`;content=`<div class="own-profile-heading">${d.photoUrl?`<img class="own-profile-photo" src="${esc(d.photoUrl)}" alt="${esc(d.englishName)}">`:`<span class="own-profile-photo profile-initial" aria-hidden="true">${esc(d.englishName.slice(0,1))}</span>`}<div><h2>${esc(d.prefix)} ${esc(d.englishName)}</h2><p class="muted">${en?'Your profile':'你的個人資料'}</p></div></div><div class="profile-row profile-first">${item('Prefix',d.prefix)}${item('English Full Name',d.englishName)}${item('Chinese Full Name '+(en?'(optional)':'（選填）'),d.chineseName)}</div><div class="profile-row">${item('Phone',d.phone)}${item('Email',d.email)}</div><div class="profile-value"><span>${en?'Cumulative points':'累計積分'}</span><button class="points-balance-link" onclick="openOwnPoints()">${d.cumulativePoints.toLocaleString()}</button>${donationSummary()}<div>${config.categories.map(c=>`<p>${t(c.id)}: ${allowanceText(c.id)}</p>`).join('')}</div></div>`}return `<section class="panel"><h1>Profile</h1><div class="card own-profile-card">${content}</div></section>`}
let ownProfileBusy=false;async function loadOwnProfile(){if(ownProfileBusy||leafUploading)return;ownProfileBusy=true;const before=JSON.stringify([ownProfile,ownProfileStatus]);try{const r=await fetch('/api/profile'),d=await r.json();if(r.status===401){ownProfile=null;ownProfileStatus='signin'}else if(!r.ok)throw new Error(d.error);else{ownProfile=d.donor;ownProfileStatus=ownProfile?'ready':'missing'}if(state.logged&&!ADMIN_MODE&&state.view!=='password'&&before!==JSON.stringify([ownProfile,ownProfileStatus])){preserve();render()}}catch(e){ownProfileError=e.message;ownProfileStatus='error';if(state.logged&&!ADMIN_MODE&&state.view!=='password'&&before!==JSON.stringify([ownProfile,ownProfileStatus])){preserve();render()}}finally{ownProfileBusy=false}}
setInterval(()=>{if(!ADMIN_MODE&&state.logged&&!document.hidden){loadOwnProfile();if(state.view==='tree')loadTreeAdoptions();if(state.view==='history'&&!historyLoading)loadHistory(historyOffset)}},10000);
const requestIds={};function currentPoints(){return ownProfile?.cumulativePoints??(ADMIN_MODE?config.demoPoints:0)}
function treeQuantity(){const max=allowance('tree').remaining,value=state.drafts.tree?.leaves??'1';return `<div class="field"><label for="tree-count">${state.lang==='zh'?'種樹數量':'Number of trees'} *</label><input type="number" id="tree-count" name="leaves" min="1" max="${max}" step="1" value="${esc(value)}" required ${max<1?'disabled':''}><small>${state.lang==='zh'?'目前可種':'Trees available:'} ${max}${state.lang==='zh'?' 棵。只扣種樹權益，其他三項不受影響。':'. Only the tree allowance is used; other rewards are unaffected.'}</small></div>`}
let ownPointsOffset=0;async function openOwnPoints(offset=0){ownPointsOffset=offset;let dialog=$('#own-points-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='own-points-dialog';document.body.append(dialog)}dialog.innerHTML=`<div class="points-dialog-head"><h2>${state.lang==='zh'?'積分與權益記錄':'Points and allowances'}</h2><button onclick="this.closest('dialog').close()">×</button></div><div id="own-points-content">${state.lang==='zh'?'載入中…':'Loading…'}</div>`;if(!dialog.open)dialog.showModal();try{const r=await fetch('/api/donors/donations?offset='+offset),d=await r.json();if(!r.ok)throw new Error(d.error);ownProfile=d.donor;if(state.logged&&state.view!=='password'){preserve();render()}$('#own-points-content').innerHTML=donationSummary()+`<div class="points-history">${d.entries.length?d.entries.map(e=>`<div><span>${esc(e.donated_on)}</span><span>${state.lang==='zh'?'累計積分':'Cumulative points'}<br>${(Math.floor(e.total_minor/500000)*1000).toLocaleString()}</span><strong>${e.delta_minor>0?'+':''}${((Math.floor(e.total_minor/500000)-Math.floor((e.total_minor-e.delta_minor)/500000))*1000).toLocaleString()}</strong></div>`).join(''):`<p>${state.lang==='zh'?'暫無積分更新記錄。如需協助，請聯絡我們。':'No points updates yet. Please contact us if you need help.'}</p>`}</div><div class="points-pager"><button onclick="openOwnPoints(${Math.max(0,offset-50)})" ${offset===0?'disabled':''}>‹</button><button onclick="openOwnPoints(${offset+50})" ${!d.hasMore?'disabled':''}>›</button></div>`}catch(e){$('#own-points-content').textContent=e.message}}
function adminToolbar(){const en=state.lang==='en';return `<div class="manager-toolbar"><div><strong>${en?'Administrator · Live user page':'管理者 · 用戶頁面'}</strong><small>${en?'Edit, then publish to synchronise both pages.':'修改後按發佈，兩邊即同步更新。'}</small></div><div class="manager-tools"><button onclick="state.logged=!state.logged;render()">${state.logged?(en?'Login page':'登入頁'):(en?'Reward home':'兌換首頁')}</button><button onclick="openEditor('gifts')">${en?'Gift management':'禮物管理'}</button><button onclick="openEditor('requests')">${en?'Customer requests':'客戶申請'}</button></div></div>`}
function openEditor(tab){if(!ADMIN_MODE)return;let dialog=$('#manager-editor');if(!dialog){dialog=document.createElement('dialog');dialog.id='manager-editor';dialog.innerHTML=`<div class="manager-dialog-head"><strong>${state.lang==='zh'?'管理者編輯':'Administrator editor'}</strong><button onclick="closeEditor()">${state.lang==='zh'?'返回頁面':'Back to page'} ×</button></div><iframe title="Administrator editor"></iframe>`;document.body.append(dialog);dialog.addEventListener('cancel',e=>{e.preventDefault();closeEditor()})}dialog.querySelector('iframe').src=sessionTabUrl('/admin/editor?tab='+encodeURIComponent(tab)+'&lang='+state.lang);dialog.showModal()}
function closeEditor(){const dialog=$('#manager-editor');const frame=dialog.querySelector('iframe');if(frame.contentWindow.hasUnsavedChanges?.()&&!confirm(state.lang==='zh'?'有未儲存的修改，確定返回？':'Discard unsaved changes?'))return;dialog.close();frame.src='about:blank';syncContent()}
let syncing=false;async function syncContent(){if(syncing||!config)return;syncing=true;try{const r=await fetch('/api/config');if(!r.ok)return;const d=await r.json();applyRewardRules(d.config);if(JSON.stringify(d.config)!==JSON.stringify(config)){preserve();config=d.config;revision=d.revision;render()}}catch(e){console.warn('Content sync unavailable')}finally{syncing=false}}
window.addEventListener('message',e=>{if(ADMIN_MODE&&e.origin===location.origin&&e.source===$('#manager-editor')?.querySelector('iframe')?.contentWindow&&e.data?.type==='content-published')syncContent()});setInterval(()=>{if(!document.hidden)syncContent()},10000);window.addEventListener('focus',syncContent);window.addEventListener('focus',()=>{if(!ADMIN_MODE&&state.logged){loadOwnProfile();if(state.view==='tree')loadTreeAdoptions()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ADMIN_MODE&&state.logged){loadOwnProfile();if(state.view==='tree')loadTreeAdoptions()}});
boot();
</script></body></html>
