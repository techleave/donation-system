async function demoSignIn(form){const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,password:form.password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error);const target=new URLSearchParams(location.search).get('return_to');if(location.pathname==='/signin'){location.href=target?.startsWith('/')&&!target.startsWith('//')?target:(d.user.role==='admin'?'/admin':'/');return}state.logged=true;await loadOwnProfile();render()}catch(e){$('#loginError').textContent=e.message}finally{button.disabled=false}}
function signOut(){if(ownProfileStatus==='ready'||ownProfileStatus==='missing'){location.href='/signout?return_to=%2F';return}if(ADMIN_MODE){location.href="/signout?return_to=%2F";return}state.logged=false;state.drafts={};state.profile={name:'',email:''};state.requests=[];state.view='home';render()}
function shell(content){return `<div class="mobilebar">${brand()}${langSwitch()}<button class="mobile-out" onclick="signOut()">${t('signOut')}</button></div><div class="shell"><aside class="side">${brand()}${langSwitch()}<nav class="nav">${(ADMIN_MODE?['home','history','donors']:['home','history','profile']).map(v=>`<button class="${(state.view===v||(v==='home'&&['tree','airport','card','ticket'].includes(state.view)))?'active':''}" onclick="nav('${v}')">${v==='profile'?'Profile':v==='donors'?'Donors Management':ADMIN_MODE&&v==='history'?(state.lang==='zh'?'客戶申請 / Requests':'Customer requests'):t(v)}</button>`).join('')}</nav><div class="sidefoot">${t('demo')}<br>${t('side')}<br>${!ADMIN_MODE?`<button class="change-password-link" onclick="nav('password')">Change Password</button>`:''}<button class="signout" onclick="signOut()">${t('signOut')}</button></div></aside>${!ADMIN_MODE?'<div class="donor-content">':''}<main class="main ${!ADMIN_MODE?'donor-main':''}"><div class="top"><span class="eyebrow">${t('tag')}</span><span class="pill">${t('demo')}</span></div><nav class="mobile-profile-nav">${(ADMIN_MODE?['home','history','donors']:['home','history','profile']).map(v=>`<button class="${state.view===v?'active':''}" onclick="nav('${v}')">${v==='profile'?'Profile':v==='donors'?'Donors Management':ADMIN_MODE&&v==='history'?(state.lang==='zh'?'客戶申請':'Requests'):t(v)}</button>`).join('')}${!ADMIN_MODE?`<button onclick="nav('password')">Change Password</button>`:''}</nav>${content}</main>${!ADMIN_MODE?'<footer class="donor-footer"><img src="/assets/donor-footer-banner-v2.png" alt="Choral seed campaign illustration" loading="lazy"></footer></div>':''}</div>`}
function home(){const icon={tree:'♧',airport:'✧',card:'✉',ticket:'♫'};return `<h1 class="hello">${t('hello')}</h1><p class="lede">${t('question')}</p><div class="balance"><strong>${currentPoints().toLocaleString()}</strong><span>${t('points')}</span></div><section class="reward-home"><h2>${t('choose')}</h2><div class="reward-grid">${config.categories.filter(x=>x.enabled).sort((a,b)=>a.order-b.order).map(x=>`<button class="reward-tile" onclick="nav('${x.id}')"><span class="reward-cover reward-cover-${x.id}">${x.cover?`<img src="${esc(x.cover)}" alt="" loading="lazy">`:`<span class="reward-symbol" aria-hidden="true">${esc(x.icon??icon[x.id])}</span>`}</span><span class="reward-tile-copy"><span><strong>${t(x.id)}</strong><small>${t(x.id+'Short')}</small></span><span class="reward-arrow" aria-hidden="true">↗</span></span></button>`).join('')}</div></section><p class="hint">${t('hint')}</p>`}
function field(f){const val=state.drafts[state.view]?.[f.key]??'',attr=`name="${esc(f.key)}" id="f-${esc(f.key)}" ${f.required?'required':''}`;let control;if(f.type==='textarea')control=`<textarea ${attr} maxlength="${f.maxLength??2000}">${esc(val)}</textarea>`;else if(f.type==='select')control=`<select ${attr}>${f.options.map((o,i)=>`<option value="${esc(o.zh)}" ${val===o.zh?'selected':''}>${bi(o)}</option>`).join('')}</select>`;else control=`<input ${attr} type="${f.type}" value="${esc(val)}" ${f.maxLength!=null?`maxlength="${f.maxLength}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''}>`;return `<div class="field"><label for="f-${esc(f.key)}">${bi(f.label)}${f.required?' *':''}</label>${control}</div>`}
function reward(){const cat=state.view,d=state.drafts[cat]??{};const items=config.items.filter(x=>x.enabled&&x.category===cat&&(cat!=='ticket'||x.mode===state.ticketMode));return `<section class="panel"><button class="back" onclick="nav('home')">‹ ${t('back')}</button><h1>${t(cat)}</h1><p>${t(cat+'Desc')}</p>${cat==='ticket'?`<div class="chips">${['tickets','discount'].map(mode=>`<button class="${state.ticketMode===mode?'selected':''}" onclick="preserve();state.ticketMode='${mode}';render()">${t(mode)}</button>`).join('')}</div>`:''}<div class="card"><form id="rewardForm" onsubmit="event.preventDefault();sendRequest(this)">${['airport','ticket'].includes(cat)?items.length?items.map(item=>`<label class="item"><div><h3>${bi(item.title)}</h3><p>${bi(item.description)}</p><b>${item.points.toLocaleString()} ${t('points')}</b></div><input type="radio" name="rewardId" value="${esc(item.id)}" ${d.rewardId===item.id?'checked':''} required aria-label="${bi(item.title)}"></label>`).join(''):`<div class="empty">${t('none')}</div>`:''}${config.fields[cat].filter(f=>!['displayName','name','contact','customerName','customerEmail','contactName','contactEmail','phone','email'].includes(f.key)&&!(cat==='tree'&&f.key==='leaves')).map(field).join('')}${cat==='tree'?treeQuantity():''}${!ADMIN_MODE&&ownProfileStatus!=='ready'?`<div class="notice">${state.lang==='zh'?'提交時會使用你的 Profile 資料，請先登入個人 Profile。':'Your Profile is used for submission. Please sign in to your Profile first.'} <a href="/signin?return_to=%2F%3Fprofile%3D1" target="_top">${state.lang==='zh'?'登入':'Sign in'}</a></div>`:''}<div class="notice">${t('submissionNote')}</div><p id="saveError" class="login-error" role="alert"></p><button class="primary" ${(['airport','ticket'].includes(cat)&&!items.length)||(cat==='tree'&&currentPoints()<1000)?'disabled':''}>${t('submit')}</button></form></div></section>`}
async function sendRequest(form){preserve();const button=form.querySelector('.primary');button.disabled=true;const values=Object.fromEntries(new FormData(form));try{const res=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:requestIds[state.view]??(requestIds[state.view]=crypto.randomUUID()),category:state.view,itemId:values.rewardId,fields:values})});const data=await res.json();if(!res.ok)throw new Error(data.error);if(data.donor){ownProfile=data.donor;ownProfileStatus='ready'}delete requestIds[state.view];state.requests.unshift({...data,type:state.view});state.drafts[state.view]={};nav('history')}catch(e){$('#saveError').textContent=e.message;button.disabled=false}}
let historyOffset=0,historyHasMore=false,historyLoading=false,historyError='';
async function loadHistory(offset=0){if(ADMIN_MODE||!state.logged)return;historyLoading=true;historyError='';historyOffset=offset;render();try{const r=await fetch('/api/requests?offset='+offset),d=await r.json();if(!r.ok)throw new Error(d.error);state.requests=d.requests.map(r=>({...r,time:r.submitted_at,type:r.category}));historyHasMore=d.hasMore}catch(e){historyError=e.message}finally{historyLoading=false;if(state.view==='history')render()}}
function history(){return `<section class="panel"><button class="back" onclick="nav('home')">‹ ${t('back')}</button><h1>${t('history')}</h1><p>${t('historyDesc')}</p><div class="card">${state.requests.length?state.requests.map(r=>`<div class="item"><div><h3>${t(r.type)}</h3>${Object.values(r.fields).map(f=>`<p>${bi(f.label)}: ${typeof f.value==='object'?bi(f.value):esc(f.value)}</p>`).join('')}<p>${t('submitted')}: ${new Date(r.time).toLocaleString(state.lang==='zh'?'zh-HK':'en-GB')}</p></div><span class="pill">${r.status==='complete'?(state.lang==='zh'?'已完成':'Complete'):t('pending')}</span></div>`).join(''):`<div class="empty">${t('empty')}</div>`}<div class="points-pager"><button onclick="loadHistory(${Math.max(0,historyOffset-50)})" ${historyOffset===0?'disabled':''}>‹</button><button onclick="loadHistory(${historyOffset+50})" ${!historyHasMore?'disabled':''}>›</button></div><p class="muted" id="history-status">${historyLoading?(state.lang==='zh'?'載入中…':'Loading…'):esc(historyError)}</p></div></section>`}
function theme(){const th=config.theme;let style=$('#cms-theme');if(!style){style=document.createElement('style');style.id='cms-theme';document.head.append(style)}style.textContent=`:root{--reward-primary:${th.primary};--reward-surface:${th.surface};--reward-radius:${th.radius}px}body,.signin,.mobilebar{background:${th.background}}.prompt,.card,.signin-card{background:${th.surface};border-radius:${th.radius}px}.side,.primary,.chips button.selected,.option.selected{background:${th.primary}}.hello,.panel h1,.signin-intro h1,.signin-card h2,.brand,.field label,.item h3,.balance strong{color:${th.primary};-webkit-text-fill-color:${th.primary}}.prompt,.signin-card{border-top-color:${th.primary}}.pill,.signin-mark,.icon{background:${th.accent}}.primary{color:white;box-shadow:4px 4px 0 ${th.accent}}.side .brand{color:white}.main{max-width:${th.width}px}.choice strong,.item b,.back,.chev,.eyebrow,.prompt h2,.summary strong{color:${th.primary}}.choice:hover{border-color:${th.primary};box-shadow:5px 5px 0 ${th.accent}}.hello,.panel h1,.signin-intro h1,.signin-card h2{font-family:${th.font==='serif'?'Georgia,serif':'Arial,sans-serif'}}${th.navigation==='top'?'.shell{display:block}.side{position:relative;height:auto;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;padding:18px 28px}.side .nav{display:flex;gap:8px;flex:1}.side .nav button{width:auto;white-space:nowrap}.sidefoot{margin:0}.side .signout{margin:0}.sidefoot>br{display:none}@media(max-width:760px){.side{display:none}}':''}.admin-link{display:block;margin-top:22px;color:${th.primary};font-size:14px}`}
let observer;function effects(){observer?.disconnect();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');observer.unobserve(e.target)}}),{threshold:.06});document.querySelectorAll('.choice,.reward-tile,.panel,.prompt,.hello,.signin-card').forEach(e=>{e.classList.add('reveal');observer.observe(e)})}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-HK':'en';theme();$('#app').innerHTML=(ADMIN_MODE?adminToolbar():'')+(state.logged?shell(state.view==='home'?home():state.view==='history'?history():state.view==='profile'?ownProfileView():state.view==='password'?changePasswordView():reward()):login());requestAnimationFrame(effects)}
async function boot(){try{const preview=new URLSearchParams(location.search).get('preview')==='1';const res=await fetch(preview?'/api/config?admin=1':'/api/config');const d=await res.json();if(!res.ok)throw new Error(d.error);config=preview?d.draft:d.config;revision=d.revision;if(preview||ADMIN_MODE)state.logged=true;if(!ADMIN_MODE&&new URLSearchParams(location.search).get('profile')==='1'){state.logged=true;state.view='profile'}render();if(!ADMIN_MODE){const session=await fetch('/api/auth/me');const identity=await session.json();if(identity.user){state.logged=true;render()}loadOwnProfile()}}catch(e){$('#app').innerHTML=`<div class="card" style="margin:50px auto;max-width:600px"><h1>暫時未能載入 / Unable to load</h1><p>${esc(e.message)}</p><button class="primary" onclick="boot()">重試 / Retry</button></div>`}}
let ownProfile=null,ownProfileStatus='loading',ownProfileError='';
function ownProfileView(){const en=state.lang==='en';let content;if(ownProfileStatus==='signin')content=`<p>${en?'Sign in to view your own profile. Use the same email as your donor record.':'請登入查看自己的 Profile，登入電郵須與 Donor 記錄一致。'}</p><a class="primary profile-signin-link" href="/signin?return_to=%2F%3Fprofile%3D1" target="_top">${en?'Sign in':'使用電郵登入'}</a>`;else if(ownProfileStatus==='missing')content=`<p>${en?'No donor profile is linked to this signed-in email. Please contact the administrator to add or check your record.':'此登入電郵未有對應的 Donor Profile，請聯絡管理者新增或核對記錄。'}</p>`;else if(ownProfileStatus==='error')content=`<p role="alert">${esc(ownProfileError)}</p><button class="primary" onclick="loadOwnProfile()">${en?'Retry':'重試'}</button>`;else if(!ownProfile)content=`<p>${en?'Loading profile…':'載入 Profile 中…'}</p>`;else{const d=ownProfile;const item=(label,value)=>`<div class="profile-value"><span>${label}</span><strong>${esc(value)||'—'}</strong></div>`;content=`<div class="own-profile-heading">${d.photoUrl?`<img class="own-profile-photo" src="${esc(d.photoUrl)}" alt="${esc(d.englishName)}">`:`<span class="own-profile-photo profile-initial" aria-hidden="true">${esc(d.englishName.slice(0,1))}</span>`}<div><h2>${esc(d.prefix)} ${esc(d.englishName)}</h2><p class="muted">${en?'Your profile':'你的個人資料'}</p></div></div><div class="profile-row profile-first">${item('Prefix',d.prefix)}${item('English Full Name',d.englishName)}${item('Chinese Full Name '+(en?'(optional)':'（選填）'),d.chineseName)}</div><div class="profile-row">${item('Phone',d.phone)}${item('Email',d.email)}</div><div class="profile-value"><span>Demo Points</span><button class="points-balance-link" onclick="openOwnPoints()">${d.demoPoints.toLocaleString()}</button></div>`}return `<section class="panel"><h1>Profile</h1><div class="card own-profile-card">${content}</div></section>`}
let ownProfileBusy=false;async function loadOwnProfile(){if(ownProfileBusy)return;ownProfileBusy=true;const before=JSON.stringify([ownProfile,ownProfileStatus]);try{const r=await fetch('/api/profile'),d=await r.json();if(r.status===401){ownProfile=null;ownProfileStatus='signin'}else if(!r.ok)throw new Error(d.error);else{ownProfile=d.donor;ownProfileStatus=ownProfile?'ready':'missing'}if(state.logged&&!ADMIN_MODE&&state.view!=='password'&&before!==JSON.stringify([ownProfile,ownProfileStatus])){preserve();render()}}catch(e){ownProfileError=e.message;ownProfileStatus='error';if(state.logged&&!ADMIN_MODE&&state.view!=='password'&&before!==JSON.stringify([ownProfile,ownProfileStatus])){preserve();render()}}finally{ownProfileBusy=false}}
setInterval(()=>{if(!ADMIN_MODE&&state.logged&&!document.hidden)loadOwnProfile()},10000);
const requestIds={};function currentPoints(){return ownProfile?.demoPoints??(ADMIN_MODE?config.demoPoints:0)}
function treeQuantity(){const max=Math.floor(currentPoints()/1000),value=state.drafts.tree?.leaves??'1';return `<div class="field"><label for="tree-count">${state.lang==='zh'?'種樹數量 / Number of Leaves':'Number of Leaves / Trees'} *</label><input type="number" id="tree-count" name="leaves" min="1" max="${max}" step="1" value="${esc(value)}" required ${max<1?'disabled':''}><small>${state.lang==='zh'?'每棵樹使用 1,000 分；目前最多可兌換':'1,000 points per tree; currently available:'} ${max} ${state.lang==='zh'?'棵。提交成功後扣分。':'trees. Points are deducted after submission.'}</small></div>`}
function changePasswordView(){const en=state.lang==='en';return `<section class="panel"><button class="back" onclick="nav('home')">‹ ${t('back')}</button><h1>Change Password</h1><p>${en?'Request a PIN using your email address.':'使用電郵申請 PIN 碼。'}</p><div class="card"><form onsubmit="event.preventDefault();passwordDemoNotice()"><div class="field"><label for="password-email">Email</label><input id="password-email" type="email" autocomplete="email" value="${esc(ownProfile?.email??'')}" required></div><button type="button" class="option" onclick="if(document.querySelector('#password-email').reportValidity())passwordDemoNotice()">${en?'Send PIN':'發送 PIN'}</button><div class="field" style="margin-top:25px"><label for="password-pin">PIN</label><input id="password-pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></div><p class="muted">${en?'Layout preview only. No email is sent and no password is changed yet.':'目前只供版面預覽，暫未發送電郵或更改密碼。'}</p><p id="password-demo-status" role="status"></p><button class="primary">${en?'Continue':'繼續'}</button></form></div></section>`}
function passwordDemoNotice(){document.querySelector('#password-demo-status').textContent=state.lang==='zh'?'示範版面：電郵及密碼流程尚未啟用。':'Preview: the email and password process is not connected yet.'}
let ownPointsOffset=0;async function openOwnPoints(offset=0){ownPointsOffset=offset;let dialog=$('#own-points-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='own-points-dialog';document.body.append(dialog)}dialog.innerHTML=`<div class="points-dialog-head"><h2>Demo Points</h2><button onclick="document.querySelector('#own-points-dialog').close()">×</button></div><div id="own-points-content">${state.lang==='zh'?'載入中…':'Loading…'}</div>`;if(!dialog.open)dialog.showModal();try{const r=await fetch('/api/donors/points?offset='+offset),d=await r.json();if(!r.ok)throw new Error(d.error);ownProfile=d.donor;if(state.logged&&state.view!=='password'){preserve();render()}$('#own-points-content').innerHTML=`<p class="points-total">${d.donor.demoPoints.toLocaleString()}</p><div class="points-history">${d.entries.length?d.entries.map(e=>`<div><span>${new Date(e.created_at).toLocaleString(state.lang==='zh'?'zh-HK':'en-GB',{timeZone:'Asia/Hong_Kong'})}</span><span>${e.kind==='add'?(state.lang==='zh'?'加分':'Added'):(state.lang==='zh'?'種樹兌換':'Tree redemption')}</span><strong>${e.amount>0?'+':''}${e.amount.toLocaleString()}</strong></div>`).join(''):`<p>${state.lang==='zh'?'暫無積分記錄':'No points history yet'}</p>`}</div><div class="points-pager"><button onclick="openOwnPoints(${Math.max(0,offset-50)})" ${offset===0?'disabled':''}>‹</button><button onclick="openOwnPoints(${offset+50})" ${!d.hasMore?'disabled':''}>›</button></div>`}catch(e){$('#own-points-content').textContent=e.message}}
function adminToolbar(){const en=state.lang==='en';return `<div class="manager-toolbar"><div><strong>${en?'Administrator · Live user page':'管理者 · 用戶頁面'}</strong><small>${en?'Edit, then publish to synchronise both pages.':'修改後按「發佈到用戶頁面」，兩邊即同步更新。'}</small></div><div class="manager-tools"><button onclick="state.logged=!state.logged;render()">${state.logged?(en?'Login page':'登入頁'):(en?'Reward home':'兌換首頁')}</button><button onclick="openEditor('text')">${en?'Edit text':'編輯文字'}</button><button onclick="openEditor('categories')">${en?'Cards & covers':'卡片與封面'}</button><button onclick="openEditor('appearance')">${en?'Brand & appearance':'品牌與外觀'}</button><button onclick="openEditor('items')">${en?'Rewards':'兌換項目'}</button><button onclick="openEditor('fields')">${en?'Form fields':'表單欄位'}</button><button onclick="openEditor('requests')">${en?'Customer requests':'客戶申請'}</button></div></div>`}
function openEditor(tab){if(!ADMIN_MODE)return;let dialog=$('#manager-editor');if(!dialog){dialog=document.createElement('dialog');dialog.id='manager-editor';dialog.innerHTML=`<div class="manager-dialog-head"><strong>${state.lang==='zh'?'管理者編輯':'Administrator editor'}</strong><button onclick="closeEditor()">${state.lang==='zh'?'返回頁面':'Back to page'} ×</button></div><iframe title="Administrator editor"></iframe>`;document.body.append(dialog);dialog.addEventListener('cancel',e=>{e.preventDefault();closeEditor()})}dialog.querySelector('iframe').src='/admin/editor?tab='+encodeURIComponent(tab)+'&lang='+state.lang;dialog.showModal()}
function closeEditor(){const dialog=$('#manager-editor');const frame=dialog.querySelector('iframe');if(frame.contentWindow.hasUnsavedChanges?.()&&!confirm(state.lang==='zh'?'有未儲存的修改，確定返回？':'Discard unsaved changes?'))return;dialog.close();frame.src='about:blank';syncContent()}
let syncing=false;async function syncContent(){if(syncing||!config)return;syncing=true;try{const r=await fetch('/api/config');if(!r.ok)return;const d=await r.json();if(JSON.stringify(d.config)!==JSON.stringify(config)){preserve();config=d.config;revision=d.revision;render()}}catch(e){console.warn('Content sync unavailable')}finally{syncing=false}}
window.addEventListener('message',e=>{if(ADMIN_MODE&&e.origin===location.origin&&e.source===$('#manager-editor')?.querySelector('iframe')?.contentWindow&&e.data?.type==='content-published')syncContent()});setInterval(()=>{if(!document.hidden)syncContent()},10000);window.addEventListener('focus',syncContent);
boot();
</script></body></html>
