function coverKey(event,id){const arrows={ArrowLeft:['x',-1],ArrowRight:['x',1],ArrowUp:['y',-1],ArrowDown:['y',1]},change=arrows[event.key];if(!change)return;event.preventDefault();const c=draft.categories.find(c=>c.id===id);if(c)adjustCover(id,change[0],coverCrop(c)[change[0]]+change[1]*(event.shiftKey?5:1))}

function gifts(){const en=lang==='en',active=draft.categories.filter(c=>!c.archived).sort((a,b)=>a.order-b.order);if(managingGift){const c=draft.categories.find(c=>c.id===managingGift&&!c.archived);if(c){fieldCategory=c.id;const content=giftContent(c),index=draft.categories.indexOf(c);return `<button class="gift-back" onclick="managingGift=null;render()">‹ ${en?'All gifts':'所有禮物'}</button><div class="gift-manage"><aside><div id="selected-gift-preview">${giftPreview(c)}</div><p class="help">${en?'Card preview · editing '+(lang==='en'?'English':'Chinese'):'卡片預覽 · 正在編輯繁體中文'}</p><p class="help">${c.id==='ticket'?(en?'Existing concert-ticket allowance remains unchanged.':'沿用現有門票兌換規則。'):en?'One independent allowance for every 1,000 cumulative points.':'每累計 1,000 積分可兌換一次，獨立計算。'}</p></aside><div class="gift-editor"><section class="card"><h3>${en?'Card and detail text':'卡片及詳情文字'}</h3>${['zh','en'].map(language=>`<h4>${language==='zh'?'繁體中文':'English'}</h4>${['title','short','description'].map(key=>field(({title:language==='zh'?'禮物名稱':'Gift name',short:language==='zh'?'卡片簡介':'Card summary',description:language==='zh'?'詳情頁描述':'Detail page description'})[key],`<textarea maxlength="${key==='title'?120:key==='short'?400:4000}" oninput="setGiftContent('${c.id}','${key}','${language}',this.value)">${esc(content[key][language])}</textarea>`)).join('')}`).join('')}${toggle('categories.'+index+'.enabled',c.enabled)}</section><section class="card"><h3>${en?'Cover image':'封面圖片'}</h3><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="uploadCover('${c.id}',this)"><p class="help">PNG / JPG / WebP / GIF · 10 MB</p><div id="cover-preview-${c.id}">${coverEditor(c)}</div><button onclick="clearCover('${c.id}')">${en?'Remove cover':'移除封面'}</button></section><section class="gift-section"><h3>${en?'Redemption options':'兌換選項'}</h3>${items()}</section><section class="gift-section"><h3>${en?'Details and application fields':'詳情及申請欄位'}</h3><p class="help">${en?'Use textarea for a response box, or description for text only.':'可新增多行文字框供填寫需求，或選 description 加入純說明文字。'}</p>${fields()}</section></div></div>`}}return `<div class="gift-list-head"><p>${en?'Manage each gift’s image, copy and application in one place.':'在同一處管理每份禮物的圖片、文字及申請內容。'}</p><button class="primary" onclick="addGift()">＋ ${en?'Add gift':'新增禮物'}</button></div><div class="gift-grid">${active.map((c,i)=>`<article class="gift-admin-card">${giftPreview(c)}<div class="gift-card-actions"><button class="primary" onclick="manageGift('${c.id}')">Manage / ${en?'Edit':'編輯'}</button><button onclick="shiftGift('${c.id}',-1)" ${i===0?'disabled':''}>↑</button><button onclick="shiftGift('${c.id}',1)" ${i===active.length-1?'disabled':''}>↓</button><button class="gift-delete" onclick="archiveGift('${c.id}')">${en?'Delete':'刪除'}</button></div>${!c.enabled?`<p class="help">${en?'Not available to donors':'暫未開放'}</p>`:''}</article>`).join('')}</div>${draft.categories.some(c=>c.archived)?`<details class="card"><summary>${en?'Removed gifts':'已下架禮物'}</summary>${draft.categories.filter(c=>c.archived).map(c=>`<p>${esc(giftName(c))} <button onclick="restoreGift('${c.id}')">${en?'Restore':'還原'}</button></p>`).join('')}</details>`:''}`}

function setGiftContent(id,key,language,value){const c=draft.categories.find(c=>c.id===id);if(!c)return;c.content=structuredClone(giftContent(c));c.content[key][language]=value;dirty=true;const preview=$('#selected-gift-preview');if(preview)preview.innerHTML=giftPreview(c);status(l('changes'))}

function shiftGift(id,direction){const active=draft.categories.filter(c=>!c.archived).sort((a,b)=>a.order-b.order),i=active.findIndex(c=>c.id===id),j=i+direction;if(j<0||j>=active.length)return;[active[i],active[j]]=[active[j],active[i]];active.forEach((c,k)=>c.order=k);dirty=true;render();status(l('changes'))}

function legacyCategories(){return `<div class="card">${draft.categories.map((c,i)=>`<div class="formrow"><h3>${esc(cat(c.id))}</h3>${field('封面圖片 / Cover image',`<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="uploadCover('${c.id}',this)"><p class="help">PNG、JPG、WebP、GIF · 最多 10 MB / Up to 10 MB. 建議 16:9 / Recommended 16:9.</p><div id="cover-preview-${c.id}">${coverEditor(c)}</div><div class="actions"><button onclick="clearCover('${c.id}')">${lang==='zh'?'移除封面':'Remove cover'}</button></div>`)}${field('圖示 / Icon',textInput('categories.'+i+'.icon',c.icon))}${toggle('categories.'+i+'.enabled',c.enabled)}<div class="actions"><button onclick="moveCategory(${i},-1)" ${i===0?'disabled':''}>${l('up')}</button><button onclick="moveCategory(${i},1)" ${i===3?'disabled':''}>${l('down')}</button></div></div>`).join('')}</div>`}

async function uploadCover(id,input){const file=input.files[0];if(!file)return;if(file.size>10*1024*1024){status(lang==='zh'?'圖片不可超過 10 MB':'Image must be under 10 MB',true);input.value='';return}input.disabled=true;status(lang==='zh'?'正在上傳封面…':'Uploading cover…');try{const body=new FormData();body.append('file',file);const r=await fetch('/api/covers',{method:'POST',body});const d=await r.json();if(!r.ok)throw new Error(d.error);const c=draft.categories.find(c=>c.id===id);c.cover=d.url;delete c.coverCrop;dirty=true;if(tab==='gifts')render();status(lang==='zh'?'封面已上傳，儲存草稿或發佈後生效':'Cover uploaded. Save draft or publish to apply.')}catch(e){status(e.message,true)}finally{input.disabled=false;input.value=''}}

function addItem(){draft.items.push({id:crypto.randomUUID(),category:managingGift,mode:'tickets',title:{zh:'新項目',en:'New reward'},description:{zh:'',en:''},points:1000,enabled:true});dirty=true;render();status(l('changes'))}

async function save(action){status(l('saving'));$('#actions').querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:draft,revision,action})});const d=await r.json();if(!r.ok)throw new Error(d.error);revision=d.revision;dirty=false;if(action==='publish'){published=structuredClone(draft);parent.postMessage({type:'content-published'},location.origin)}status(l(action==='publish'?'live':'saved'));render();return true}catch(e){status(e.message,true);return false}finally{$('#actions').querySelectorAll('button').forEach(b=>b.disabled=false)}}

let treeLinkRequest=null,treeLinkRows=[],treeLinkQuantity=0;
async function manageTreeLinks(id){let dialog=$('#tree-links-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='tree-links-dialog';dialog.style.cssText='width:min(680px,94vw);max-height:90vh;overflow:auto;padding:28px;border:1px solid #c9c0a3;border-radius:14px;background:#faf7e8;color:#294d3b';document.body.append(dialog)}dialog.innerHTML=`<h3>${dl('樹木認養連結','Tree adoption links')}</h3><p>${l('loading')}</p>`;if(!dialog.open)dialog.showModal();try{const r=await fetch('/api/tree-adoptions?requestId='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error);treeLinkRequest=id;treeLinkRows=d.trees;treeLinkQuantity=d.quantity;renderTreeLinkEditor(1)}catch(e){dialog.innerHTML=`<p role="alert">${esc(e.message)}</p><button onclick="this.closest('dialog').close()">${dl('關閉','Close')}</button>`}}
function renderTreeLinkEditor(index){const t=treeLinkRows.find(t=>t.treeIndex===index);$('#tree-links-dialog').innerHTML=`<div class="actions" style="justify-content:space-between"><h3>${dl('樹木認養連結','Tree adoption links')}</h3><button onclick="this.closest('dialog').close()">×</button></div><p>${dl('每棵樹填寫一個 HTTPS 認養連結，儲存後用戶可在認養頁看到連結及二維碼。','Add one HTTPS adoption link per tree. Saving synchronises its link and QR code to the donor’s adoption page.')}</p><p>${dl('已設定','Assigned')}: ${treeLinkRows.length} / ${treeLinkQuantity}</p><form onsubmit="event.preventDefault();saveTreeLink(this)"><label>${dl('樹木編號','Tree number')} (1–${treeLinkQuantity})</label><input type="number" name="treeIndex" min="1" max="${treeLinkQuantity}" step="1" value="${index}" required onchange="if(this.checkValidity())renderTreeLinkEditor(Number(this.value))"><label>${dl('卡片名稱（選填）','Card label (optional)')}</label><input name="label" maxlength="120" value="${esc(t?.label||'')}" placeholder="${dl('例如：我的第一棵樹','e.g. My first tree')}"><label>${dl('認養連結','Adoption link')} *</label><input name="url" type="url" required maxlength="2048" placeholder="https://…" value="${esc(t?.url||'')}"><input name="revision" type="hidden" value="${t?.revision||0}"><p id="tree-link-error" class="status" role="status"></p><button type="submit" class="primary">${dl('儲存並同步','Save and sync')}</button></form>${t?`<div style="margin-top:20px;text-align:center"><img style="width:180px;height:180px;background:white" src="/api/tree-adoptions/qr?requestId=${encodeURIComponent(treeLinkRequest)}&index=${index}&v=${t.revision}" alt="QR code"><p><a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${dl('查看認養連結','Open adoption link')} ↗</a></p></div>`:''}<div style="margin-top:22px"><h4>${dl('已設定的樹木','Assigned trees')}</h4>${treeLinkRows.map(t=>`<button type="button" style="margin:4px" onclick="renderTreeLinkEditor(${t.treeIndex})">${t.treeIndex} · ${esc(t.label)||dl('認養樹木','Adopted tree')}</button>`).join('')}</div>`}
async function saveTreeLink(form){const button=form.querySelector('[type=submit]');button.disabled=true;try{const index=Number(form.treeIndex.value);const r=await fetch('/api/tree-adoptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:treeLinkRequest,treeIndex:index,url:form.url.value,label:form.label.value,revision:Number(form.revision.value)})}),d=await r.json();if(!r.ok)throw new Error(d.error);const row={treeIndex:index,url:form.url.value.trim(),label:form.label.value.trim(),revision:d.revision};treeLinkRows=treeLinkRows.filter(t=>t.treeIndex!==index).concat(row).sort((a,b)=>a.treeIndex-b.treeIndex);renderTreeLinkEditor(index);$('#tree-link-error').textContent=dl('已儲存，用戶認養頁將自動更新。','Saved. The donor’s adoption page updates automatically.')}catch(e){$('#tree-link-error').textContent=e.message;button.disabled=false}}

function requestTable(){return `<div class="notice">${lang==='zh'?'申請使用登入者 Profile，並已檢查該項剩餘權益；提交即預留，標記完成不會再次扣減。':'Requests use the signed-in donor profile and are checked against that reward’s allowance. Submission reserves it; marking complete does not deduct it again.'}</div><div class="card tablewrap"><table><thead><tr><th>${l('customer')}</th><th>${l('category')}</th><th>${l('time')}</th><th>${l('detail')}</th><th>${l('status')}</th></tr></thead><tbody>${requests.length?requests.map(r=>`<tr><td>${esc(r.name)}<br><span class="small">${esc(r.email)}</span></td><td>${esc(cat(r.category))}</td><td>${new Date(r.submitted_at).toLocaleString(lang==='zh'?'zh-HK':'en-GB')}</td><td><details><summary>${l('detail')}</summary><dl>${Object.values(r.fields).map(reviewField).join('')}</dl></details></td><td>${reviewControl(r)}${r.category==='tree'?`<button style="margin-top:12px" onclick="manageTreeLinks('${r.id}')">${dl('管理認養連結／二維碼','Manage tree links / QR codes')}</button>`:''}</td></tr>`).join(''):`<tr><td colspan="5">${lang==='zh'?'暫無申請':'No requests yet'}</td></tr>`}</tbody></table><div class="pager"><button onclick="page--;loadRequests()" ${page===0?'disabled':''}>${l('previous')}</button><span>${page+1}</span><button onclick="page++;loadRequests()" ${!hasMore?'disabled':''}>${l('next')}</button></div></div>`}
async function setRequestStatus(id,value){try{const r=await fetch('/api/requests',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to update');await loadRequests();status(l('saved'))}catch(e){status(e.message,true);loadRequests()}}
async function exportCSV(){try{let all=[],offset=0;for(;;){const r=await fetch('/api/requests?offset='+offset);const d=await r.json();if(!r.ok)throw new Error(d.error);all.push(...d.requests);if(!d.hasMore)break;offset+=50}const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const rows=[['ID','Name','Email','Category','Submitted','Status','Fields'],...all.map(r=>[r.id,r.name,r.email,r.category,r.submitted_at,r.status,JSON.stringify(r.fields)])];const blob=new Blob(['\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='donor-requests.csv';a.click();URL.revokeObjectURL(url)}catch(e){status(e.message,true)}}
let donorRows=[],donorPage=0,donorMore=false,donorSearch='',selectedDonor=null,donorDirty=false,donorBusy=false,importCsvText='';
const dl=(zh,en)=>lang==='zh'?zh:en;
function donorActions(){return `<button onclick="downloadDonorTemplate()">${dl('CSV 範本','CSV template')}</button><button onclick="document.querySelector('#donor-csv-file').click()">Import CSV</button><input hidden id="donor-csv-file" type="file" accept=".csv,text/csv" onchange="previewDonorCsv(this)"><button class="primary" onclick="editDonor()">＋ ${dl('新增','Add')}</button>`}
function donorAvatar(d){return d.photoUrl?`<img class="donor-avatar" src="${esc(d.photoUrl)}" alt="${esc(d.englishName)}">`:`<span class="donor-avatar donor-initial" aria-hidden="true">${esc((d.englishName||'?').slice(0,1))}</span>`}
function donorsView(){return `<div class="donors-area" id="donors-area">${selectedDonor?donorProfileEditor():`<div class="card"><label for="donor-search">${dl('搜尋姓名、電話或電郵','Search name, phone or email')}</label><input id="donor-search" value="${esc(donorSearch)}" placeholder="${dl('搜尋 Donor','Search donors')}" oninput="searchDonors(this.value)"></div><div id="donor-list">${donorList()}</div>`}</div><dialog id="donor-import-dialog"><div class="card"><h3>${dl('匯入預覽','Import preview')}</h3><div id="donor-import-preview"></div><p class="help">${dl('按電郵更新，保留照片及已兌換記錄。Cumulative Donation 必須填累計捐款總額（HKD），不是本月新增金額；Donation Date 填 YYYY-MM-DD。相同總額不重複加款；較低總額會跳過，以防舊檔覆蓋。如需更正較低總額，請進入個人捐款記錄。','Matched by email; photos and redemptions are retained. Cumulative Donation is the total donated in HKD, not this month’s payment. Donation Date: YYYY-MM-DD. Equal totals are not added again; lower totals are skipped to protect against older files. Correct lower totals in the donor’s donation record.')}</p><p id="donor-import-error" class="status error" role="alert"></p><div class="actions"><button onclick="document.querySelector('#donor-import-dialog').close()">${dl('取消','Cancel')}</button><button class="primary" id="donor-import-confirm" onclick="importDonors()">${dl('確認匯入','Confirm import')}</button></div></div></dialog>`}
function donorList(){return `<div class="donor-list-head"><span>${dl('姓名','Name')}</span><span>${dl('中文姓名','Chinese name')}</span><span>Phone</span><span>Email</span><span></span><span>${dl('累計積分','Cumulative points')}</span></div>${donorRows.length?donorRows.map(d=>`<div class="donor-row">${donorAvatar(d)}<button class="donor-name" onclick="editDonor('${d.id}')">${esc(d.prefix)} ${esc(d.englishName)}</button><span class="donor-chinese">${esc(d.chineseName)||'—'}</span><span class="donor-phone">${esc(d.phone)||'—'}</span><span class="donor-email">${esc(d.email)}</span><div class="actions"><button onclick="editDonor('${d.id}')">${dl('編輯','Edit')}</button><button class="donor-delete" onclick="deleteDonor('${d.id}')">${dl('刪除','Delete')}</button></div><button class="donor-points-link" onclick="openDonorPoints('${d.id}')">${(d.cumulativePoints??0).toLocaleString()}<small style="display:block;font-size:11px">HK$${Number(d.cumulativeDonation??0).toLocaleString()}</small></button></div>`).join(''):`<div class="empty card">${dl('暫無 Donor，請匯入 CSV 或新增。','No donors. Import a CSV or add a donor.')}</div>`}<div class="pager"><button onclick="donorPage--;loadDonors()" ${donorPage===0?'disabled':''}>${l('previous')}</button><span>${donorPage+1}</span><button onclick="donorPage++;loadDonors()" ${!donorMore?'disabled':''}>${l('next')}</button></div>`}
function donorProfileEditor(){const d=selectedDonor;const input=(key,type='text',required=false,max=150)=>`<input name="${key}" type="${type}" value="${esc(d[key])}" maxlength="${max}" ${required?'required':''} oninput="selectedDonor.${key}=this.value;donorDirty=true;status(l('changes'))">`;return `<button onclick="backToDonors()">‹ ${dl('返回 Donors Management','Back to Donors Management')}</button><div class="card donor-profile-editor"><div class="donor-profile-heading">${donorAvatar(d)}<div><h3>${d.id?esc(d.englishName):dl('新增 Donor','Add donor')}</h3><p class="help">${dl('儲存後即同步到該 Donor 的 Profile。','Saving synchronises this donor’s profile.')}</p></div></div><form id="donor-profile-form" onsubmit="event.preventDefault();saveDonor()"><div class="donor-profile-row donor-profile-first">${field('Prefix',input('prefix','text',false,40))}${field('English Full Name *',input('englishName','text',true))}${field('Chinese Full Name '+dl('（選填）','(optional)'),input('chineseName','text',false,100))}</div><div class="donor-profile-row">${field('Phone',input('phone','tel',false,50))}${field('Email *',input('email','email',true,180))}</div><div class="actions"><button type="submit" class="primary" ${donorBusy?'disabled':''}>${dl('儲存並同步','Save & sync')}</button>${d.id?`<button type="button" class="donor-delete" onclick="deleteDonor('${d.id}')">${dl('刪除 Donor','Delete donor')}</button>`:''}</div></form>${d.id?`<div class="donor-points-section"><label>${dl('累計積分','Cumulative points')}</label><button type="button" class="donor-points-link" onclick="openDonorPoints('${d.id}')">${(d.cumulativePoints??0).toLocaleString()}<small style="display:block;font-size:11px">HK$${Number(d.cumulativeDonation??0).toLocaleString()}</small></button><button type="button" onclick="openDonorPoints('${d.id}')">＋ ${dl('登記捐款','Record donation')}</button></div>`:''}${d.id?`<div class="donor-photo-upload"><button type="button" onclick="provisionDonorLogin('${d.id}')">${dl('建立／重設登入密碼','Create / reset login password')}</button><p class="help">${dl('產生臨時密碼供你交給此 Donor，不會自動發送電郵。','Generate a temporary password to give to this donor. No email is sent automatically.')}</p></div>`:''}<div class="donor-photo-upload"><label for="donor-photo">${dl('照片 · PNG／JPG','Photo · PNG / JPG')}</label><input id="donor-photo" type="file" accept="image/png,image/jpeg" onchange="uploadDonorPhoto(this)" ${!d.id||donorBusy?'disabled':''}><p class="help">${d.id?dl('最多 10 MB，照片只供本人及管理者查看。','Up to 10 MB. Photos are visible to the donor and administrators.'):dl('先儲存 Donor，再上傳照片。','Save the donor before uploading a photo.')}</p></div></div>`}
let donorSearchTimer;function searchDonors(value){donorSearch=value;donorPage=0;clearTimeout(donorSearchTimer);donorSearchTimer=setTimeout(loadDonors,250)}
async function loadDonors(){if(tab!=='donors'||donorBusy)return;const search=donorSearch,offset=donorPage*50;try{const r=await fetch('/api/donors?offset='+offset+'&search='+encodeURIComponent(search));const d=await r.json();if(!r.ok)throw new Error(d.error);if(search!==donorSearch||offset!==donorPage*50||tab!=='donors')return;donorRows=d.donors;donorMore=d.hasMore;const list=$('#donor-list');if(list)list.innerHTML=donorList()}catch(e){status(e.message,true)}}
async function editDonor(id){if(donorDirty&&!confirm(dl('放棄未儲存的修改？','Discard unsaved changes?')))return;try{if(id){const r=await fetch('/api/donors?id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=d.donor}else selectedDonor={prefix:'',englishName:'',chineseName:'',phone:'',email:'',photoUrl:null};donorDirty=false;render();status('')}catch(e){status(e.message,true)}}
function backToDonors(){if(donorDirty&&!confirm(dl('放棄未儲存的修改？','Discard unsaved changes?')))return;selectedDonor=null;donorDirty=false;render();loadDonors();status('')}
async function saveDonor(){const form=$('#donor-profile-form');if(!form||!form.reportValidity()||donorBusy)return false;donorBusy=true;status(l('saving'));form.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/donors',{method:selectedDonor.id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(selectedDonor)}),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=d.donor;donorDirty=false;donorBusy=false;render();status(dl('Profile 已儲存並同步。','Profile saved and synchronised.'));return true}catch(e){status(e.message,true);return false}finally{donorBusy=false;form.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function deleteDonor(id){if(donorBusy)return;let donor=selectedDonor?.id===id?selectedDonor:donorRows.find(d=>d.id===id);if(!donor||!confirm(dl('確定刪除此 Donor？','Delete this donor?')+'\n'+donor.englishName+'\n'+donor.email))return;donorBusy=true;try{const r=await fetch('/api/donors',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,revision:donor.revision})}),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=null;donorDirty=false;donorBusy=false;render();await loadDonors();status(dl('Donor 已刪除。','Donor deleted.'))}catch(e){status(e.message,true)}finally{donorBusy=false}}
async function uploadDonorPhoto(input){const file=input.files[0];if(!file||!selectedDonor?.id)return;if(file.size>10*1024*1024){status(dl('照片不可超過 10 MB','Photo exceeds 10 MB'),true);input.value='';return}if(donorDirty&&!await saveDonor()){input.value='';return}donorBusy=true;input.disabled=true;status(dl('正在上傳照片…','Uploading photo…'));try{const body=new FormData();body.append('file',file);body.append('id',selectedDonor.id);body.append('revision',selectedDonor.revision);const r=await fetch('/api/donors/photo',{method:'POST',body}),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=d.donor;donorBusy=false;render();status(dl('照片已儲存並同步。','Photo saved and synchronised.'))}catch(e){status(e.message,true)}finally{donorBusy=false;input.disabled=false;input.value=''}}
function downloadDonorTemplate(){const blob=new Blob(['\uFEFFPrefix,English Full Name,Chinese Full Name,Phone,Email,Cumulative Donation,Donation Date\r\n'],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='donors-cumulative-donations-template.csv';a.click();URL.revokeObjectURL(url)}
async function previewDonorCsv(input){const file=input.files[0];input.value='';if(!file)return;if(file.size>2*1024*1024){status(dl('CSV 不可超過 2 MB','CSV exceeds 2 MB'),true);return}status(dl('檢查 CSV 中…','Checking CSV…'));try{importCsvText=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());const r=await fetch('/api/donors/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:importCsvText,action:'preview'})}),d=await r.json();if(!r.ok)throw new Error(d.error);$('#donor-import-preview').innerHTML=`<p>${dl('新增','Add')}: <b>${d.added}</b> · ${dl('更新','Update')}: <b>${d.updated}</b> · ${dl('總共','Total')}: <b>${d.total}</b></p><p>${dl('捐款更新','Donation updates')}: ${d.donationUpdates} · ${dl('無變更','Unchanged')}: ${d.unchangedDonations} · ${dl('跳過較低總額','Lower totals skipped')}: ${d.skippedLower}</p><div class="tablewrap"><table><tr><th>English Full Name</th><th>Chinese Full Name</th><th>Phone</th><th>Email</th><th>HKD (total)</th><th>Date</th></tr>${d.preview.map(x=>`<tr><td>${esc(x.prefix)} ${esc(x.englishName)}</td><td>${esc(x.chineseName)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${x.donationMinor==null?'—':(x.donationMinor/100).toLocaleString()}</td><td>${esc(x.donationDate??'')}</td></tr>`).join('')}</table></div>`;$('#donor-import-error').textContent='';$('#donor-import-dialog').showModal();status('')}catch(e){status(e.message,true)}}
async function importDonors(){const button=$('#donor-import-confirm');button.disabled=true;try{const r=await fetch('/api/donors/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:importCsvText,action:'import'})}),d=await r.json();if(!r.ok)throw new Error(d.error);$('#donor-import-dialog').close();importCsvText='';selectedDonor=null;donorDirty=false;donorPage=0;render();await loadDonors();status(dl('匯入完成：','Import complete: ')+d.added+dl(' 人新增，',' added, ')+d.updated+dl(' 人更新。較低捐款總額跳過：',' updated. Lower totals skipped: ')+d.skippedLower)}catch(e){$('#donor-import-error').textContent=e.message}finally{button.disabled=false}}
async function syncDonors(){if(tab!=='donors'||document.hidden||donorBusy)return;if(!selectedDonor){loadDonors();return}if(!selectedDonor.id||donorDirty)return;try{const r=await fetch('/api/donors?id='+selectedDonor.id),d=await r.json();if(r.ok&&d.donor.revision!==selectedDonor.revision){selectedDonor=d.donor;render()}else if(r.status===404){selectedDonor=null;render();loadDonors()}}catch(e){}}
setInterval(syncDonors,10000);

let donorPointsId='',donorPointsOffset=0,pointOperationId=null,pointSaving=false,donationRevision=0,donationBefore=0;
async function openDonorPoints(id,offset=0){if(donorDirty&&!await saveDonor())return;if(donorPointsId!==id)pointOperationId=null;donorPointsId=id;donorPointsOffset=offset;let dialog=$('#donor-points-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='donor-points-dialog';document.body.append(dialog)}dialog.innerHTML=`<div class="point-dialog-head"><h3>${dl('捐款與權益','Donations and allowances')}</h3><button onclick="this.closest('dialog').close()">×</button></div><div id="donor-points-content">${l('loading')}</div>`;if(!dialog.open)dialog.showModal();try{const r=await fetch('/api/donors/donations?id='+id+'&offset='+offset),d=await r.json();if(!r.ok)throw new Error(d.error);donationRevision=d.donor.revision;donationBefore=Number(d.donor.cumulativeDonation);if(selectedDonor?.id===id&&!donorDirty){selectedDonor=d.donor;const area=$('#donors-area');if(area)area.innerHTML=donorProfileEditor()}$('#donor-points-content').innerHTML=`<p>${esc(d.donor.englishName)}</p><p>${dl('累計捐款','Cumulative donation')}: <b>HK$${Number(d.donor.cumulativeDonation).toLocaleString()}</b></p><p>${dl('累計積分','Cumulative points')}: ${d.donor.cumulativePoints.toLocaleString()}</p><p class="help">${dl('每 HK$5,000：機場、手工卡、種樹各 1 次。門票：HK$5,000 起共 1 張，HK$50,000 起共 2 張。四項分開計算，已提交申請佔用權益。管理員額外添加的積分也可兌換，但不計入捐款金額。','Each HK$5,000 earns an airport visit, a melody card and a tree independently. Tickets: one from HK$5,000; two in total from HK$50,000. Submitted requests reserve their allowance. Administrator-awarded points also count towards redemption, without changing the donation total.')}</p><table><tr><th>${dl('權益','Reward')}</th><th>${dl('總額','Earned')}</th><th>${dl('已用','Used')}</th><th>${dl('剩餘','Remaining')}</th></tr>${Object.entries(d.donor.entitlements).map(([c,a])=>`<tr><td>${esc(cat(c))}</td><td>${a.earned}</td><td>${a.used}</td><td>${a.remaining}</td></tr>`).join('')}</table><div class="point-history">${d.entries.map(e=>`<div><span>${esc(e.donated_on)}<br><small>${new Date(e.created_at).toLocaleString(lang==='zh'?'zh-HK':'en-GB',{timeZone:'Asia/Hong_Kong'})}</small></span><span>${dl('累計總額','Total')} HK$${(e.total_minor/100).toLocaleString()}</span><strong>${e.delta_minor>0?'+':''}${(e.delta_minor/100).toLocaleString()}</strong></div>`).join('')}</div><div class="pager"><button onclick="openDonorPoints('${id}',${Math.max(0,offset-50)})" ${offset===0?'disabled':''}>‹</button><button onclick="openDonorPoints('${id}',${offset+50})" ${!d.hasMore?'disabled':''}>›</button></div><form class="point-add-form" onsubmit="event.preventDefault();awardDonorPoints(this)"><label>${dl('額外添加積分（非捐款金額）','Add points (not a donation amount)')}</label><input type="number" name="points" min="1" max="10000000" step="1" required oninput="this.form.dataset.entryId=''"><p class="help">${dl('儲存後同步到用戶積分及兌換權益，不更改捐款金額。','Synchronises the donor’s points and redemption allowances without changing donations.')}</p><p class="award-error status error" role="alert"></p><button type="submit" class="primary">${dl('添加並同步積分','Add and sync points')}</button></form><form class="point-add-form" onsubmit="event.preventDefault();addDonorPoints(this)"><label>${dl('累計捐款總額（HKD，非新增金額）','Cumulative donation total (HKD, not an additional payment)')}</label><input type="number" name="amount" min="0" max="1000000000" step="0.01" required value="${d.donor.cumulativeDonation}" oninput="pointOperationId=null"><label>${dl('捐款日期','Donation date')}</label><input type="date" name="donationDate" required value="${new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'})}" oninput="pointOperationId=null"><p id="point-error" role="alert" class="status error"></p><button type="submit" class="primary">${dl('儲存並同步','Save and sync')}</button></form>`}catch(e){$('#donor-points-content').textContent=e.message}}
async function addDonorPoints(form){if(pointSaving||!form.reportValidity())return;if(Number(form.amount.value)<donationBefore&&!confirm(dl('總額將減少。已兌換記錄會保留，可用權益可能變為零。確定更正？','This reduces the total. Redemptions remain recorded and available allowances may become zero. Correct the total?')))return;pointSaving=true;const button=form.querySelector('button');button.disabled=true;pointOperationId??=crypto.randomUUID();try{const r=await fetch('/api/donors/donations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({donorId:donorPointsId,cumulativeDonation:form.amount.value,donationDate:form.donationDate.value,revision:donationRevision,entryId:pointOperationId})}),d=await r.json();if(!r.ok)throw new Error(d.error);pointOperationId=null;if(selectedDonor?.id===donorPointsId){selectedDonor=d.donor;const area=$('#donors-area');if(area)area.innerHTML=donorProfileEditor()}else await loadDonors();await openDonorPoints(donorPointsId);status(dl('捐款及四項權益已同步。','Donation total and all four allowances synchronised.'))}catch(e){$('#point-error').textContent=e.message}finally{pointSaving=false;button.disabled=false}}
async function awardDonorPoints(form){const button=form.querySelector('button[type="submit"]');button.disabled=true;try{const entryId=form.dataset.entryId||(form.dataset.entryId=crypto.randomUUID());const r=await fetch('/api/donors/points',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({donorId:donorPointsId,entryId,amount:Number(form.points.value)})}),d=await r.json();if(!r.ok)throw new Error(d.error);if(selectedDonor?.id===d.donor.id)selectedDonor=d.donor;await openDonorPoints(d.donor.id);loadDonors();}catch(e){form.querySelector('.award-error').textContent=e.message;button.disabled=false}}
async function provisionDonorLogin(id){if(!confirm(dl('建立或重設此 Donor 的登入密碼？','Create or reset this donor’s login password?')))return;try{const r=await fetch('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({donorId:id})}),d=await r.json();if(!r.ok)throw new Error(d.error);let box=document.querySelector('#account-password-dialog');if(!box){box=document.createElement('dialog');box.id='account-password-dialog';box.style.cssText='max-width:90vw;padding:28px;border-radius:12px;background:#faf7e8';document.body.append(box)}box.innerHTML=`<h3>${dl('登入資料','Login details')}</h3><p>${esc(d.email)}</p><p><code>${esc(d.password)}</code></p><p>${dl('此密碼只在此顯示，請妥善保存並交給 Donor。','Save this password and provide it to the donor.')}</p><button onclick="this.closest('dialog').close()">${dl('關閉','Close')}</button>`;box.showModal()}catch(e){status(e.message,true)}}
window.hasUnsavedChanges=()=>dirty||donorDirty||donorBusy;const requestedLang=new URLSearchParams(location.search).get('lang');if(['zh','en'].includes(requestedLang))lang=requestedLang;if(['categories','items','fields'].includes(tab))tab='gifts';if(!['overview','gifts','requests','donors'].includes(tab))tab='overview';
window.addEventListener('beforeunload',e=>{if(dirty||donorDirty){e.preventDefault();e.returnValue=''}});load();
setInterval(()=>{if(tab==='requests'&&!document.hidden)loadRequests()},10000);
</script></body></html>
