let draft,published,revision=0,tab=new URLSearchParams(location.search).get('tab')||'overview',lang=localStorage.getItem('adminLang')==='en'?'en':'zh',dirty=false,requests=[],page=0,hasMore=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={zh:{donors:'Donors Management',overview:'總覽',appearance:'品牌與外觀',text:'雙語文字',categories:'兌換入口',items:'兌換項目',fields:'表單欄位',requests:'客戶申請',save:'儲存草稿',publish:'發佈到用戶頁面',preview:'預覽草稿',saved:'草稿已儲存',live:'內容已發佈，用戶重新開啟即可看到',saving:'儲存中…',failed:'未能儲存',changes:'有未儲存的修改',name:'名稱',enabled:'開放',remove:'刪除',add:'新增',required:'必填',search:'搜尋文字',up:'上移',down:'下移',reload:'重新載入',export:'匯出全部 CSV',loading:'載入中…',category:'類別',customer:'客戶',time:'提交時間',detail:'填寫資料',status:'狀態',pending:'待處理',complete:'已完成',previous:'上一頁',next:'下一頁'},en:{donors:'Donors Management',overview:'Overview',appearance:'Brand & appearance',text:'Bilingual text',categories:'Reward sections',items:'Reward items',fields:'Form fields',requests:'Customer requests',save:'Save draft',publish:'Publish to user portal',preview:'Preview draft',saved:'Draft saved',live:'Published. Visitors see changes when they reopen the portal.',saving:'Saving…',failed:'Unable to save',changes:'Unsaved changes',name:'Name',enabled:'Enabled',remove:'Delete',add:'Add',required:'Required',search:'Search text',up:'Move up',down:'Move down',reload:'Reload',export:'Export all CSV',loading:'Loading…',category:'Category',customer:'Customer',time:'Submitted',detail:'Submitted fields',status:'Status',pending:'Pending',complete:'Completed',previous:'Previous',next:'Next'}};const l=k=>labels[lang][k]??k,cat=id=>draft.copy[lang][id]??id;
function status(text,error=false){$('#status').textContent=text;$('#status').className='status'+(error?' error':'')}
function set(path,value){let keys=path.split('.'),x=draft;for(const k of keys.slice(0,-1))x=x[k];x[keys.at(-1)]=value;dirty=true;status(l('changes'))}
function textInput(path,value,type='text'){return `<input type="${type}" value="${esc(value)}" oninput="set('${path}',${type==='number'?'Number(this.value)':'this.value'})">`}
function area(path,value){return `<textarea oninput="set('${path}',this.value)">${esc(value)}</textarea>`}
function field(label,control,help=''){return `<div class="field"><label>${label}</label>${control}${help?`<p class="help">${help}</p>`:''}</div>`}
function toggle(path,value){return `<label class="switch"><input type="checkbox" ${value?'checked':''} onchange="set('${path}',this.checked)">${l('enabled')}</label>`}
function language(v){lang=v;localStorage.setItem('adminLang',v);render()}
async function load(){try{const r=await fetch('/api/config?admin=1');const d=await r.json();if(!r.ok)throw new Error(d.error);draft=d.draft;published=d.published;revision=d.revision;dirty=false;render();status('');if(tab==='requests')loadRequests();if(tab==='donors')loadDonors()}catch(e){status(e.message,true)}}
function go(t){if(tab==='donors'&&donorDirty&&t!=='donors'&&!confirm(dl('放棄未儲存的修改？','Discard unsaved changes?')))return;if(t!=='donors'){selectedDonor=null;donorDirty=false}tab=t;render();if(t==='requests')loadRequests();if(t==='donors')loadDonors()}
function render(){if(!draft)return;$('#nav').innerHTML=['overview','appearance','text','categories','items','fields','requests','donors'].map(k=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${l(k)}</button>`).join('')+`<div class="language"><button onclick="language('zh')">繁中</button><button onclick="language('en')">EN</button></div>`;$('#title').textContent=l(tab);$('#actions').innerHTML=tab==='donors'?donorActions():tab==='requests'?`<button onclick="loadRequests()">${l('reload')}</button><button onclick="exportCSV()">${l('export')}</button>`:`<button onclick="save('draft')">${l('save')}</button><button onclick="preview()">${l('preview')}</button><button class="primary" onclick="save('publish')">${l('publish')}</button>`;$('#content').innerHTML=tab==='overview'?overview():tab==='appearance'?appearance():tab==='text'?texts():tab==='categories'?categories():tab==='items'?items():tab==='fields'?fields():tab==='donors'?donorsView():requestTable()}
function overview(){return `<div class="notice">${lang==='zh'?'管理員後台與用戶頁面已分開。儲存草稿不會改動用戶頁面；按「發佈」後才會更新。':'The admin and user interfaces are separate. Draft changes stay private until you publish.'}</div><div class="card"><h3>${lang==='zh'?'可修改的用戶內容':'Editable user content'}</h3><p>${lang==='zh'?'登入頁與兌換頁的雙語文字、標誌與插畫、配色、圓角、四個入口的順序及開放狀態、兌換項目、所需積分，以及表單欄位與選項。':'Bilingual login and reward text, logo and artwork, colours, corners, section order and availability, rewards, point costs, and form fields and choices.'}</p><p class="help">${lang==='zh'?'目前登入與積分資格仍是示範；客戶申請已接上資料儲存。真實捐款資料未連接。':'Donor sign-in and point eligibility remain a demo. Requests are stored; real donation records are not connected.'}</p><p>${lang==='zh'?'目前內容版本':'Content revision'}: ${revision}</p><div class="actions"><button onclick="go('appearance')">${l('appearance')}</button><button onclick="go('text')">${l('text')}</button><button onclick="go('requests')">${l('requests')}</button></div></div>`}
function appearance(){return `<div class="card"><h3>${l('appearance')}</h3>${field('品牌名稱 / Brand name',textInput('theme.brand',draft.theme.brand))}<div class="grid">${['primary','background','surface','accent'].map(k=>field(({primary:'主色 / Primary',background:'背景 / Background',surface:'表單底色 / Form surface',accent:'點綴色 / Accent'})[k],textInput('theme.'+k,draft.theme[k],'color'))).join('')}</div>${field('標題字體 / Heading font',`<select onchange="set('theme.font',this.value)"><option value="sans" ${draft.theme.font==='sans'?'selected':''}>粗體無襯線 / Sans serif</option><option value="serif" ${draft.theme.font==='serif'?'selected':''}>襯線 / Serif</option></select>`)}${field('導覽版面 / Navigation layout',`<select onchange="set('theme.navigation',this.value)"><option value="sidebar" ${draft.theme.navigation==='sidebar'?'selected':''}>側欄 / Sidebar</option><option value="top" ${draft.theme.navigation==='top'?'selected':''}>頂部 / Top bar</option></select>`)}${field('頁面最大寬度 / Maximum width (900–1800)',textInput('theme.width',draft.theme.width,'number'))}${field('圓角 / Corner radius (0–40)',textInput('theme.radius',draft.theme.radius,'number'))}${['logo','logoSecondary','art'].map(k=>field(k==='logo'?'第一個標誌網址 / First logo URL':k==='logoSecondary'?'第二個標誌網址 / Second logo URL':'登入頁插畫網址 / Login artwork URL',textInput('theme.'+k,draft.theme[k])+`<img class="image-preview" src="${esc(draft.theme[k])}" alt="">`,'使用本站圖片路徑或 HTTPS 圖片網址 / Use a site path or HTTPS image URL')).join('')}${field('示範積分 / Demo point balance',textInput('demoPoints',draft.demoPoints,'number'))}</div>`}
function texts(){return `<div class="card"><input id="copySearch" placeholder="${l('search')}" oninput="filterCopy(this.value)"><p class="help">${lang==='zh'?'左欄為文字識別碼，兩欄分別是粵語與英文。所有用戶頁面的文字都可在此編輯。':'Each key identifies a text label. Edit Cantonese and English in the two columns.'}</p>${Object.keys(draft.copy.zh).map(k=>`<div class="copyrow" data-key="${esc(k)}"><div class="copykey">${esc(k)}</div><div><label>粵語</label>${area('copy.zh.'+k,draft.copy.zh[k])}</div><div><label>English</label>${area('copy.en.'+k,draft.copy.en[k]??'')}</div></div>`).join('')}</div>`}
function filterCopy(value){value=value.toLowerCase();document.querySelectorAll('.copyrow').forEach(row=>row.hidden=!row.dataset.key.toLowerCase().includes(value)&&![...row.querySelectorAll('textarea')].some(x=>x.value.toLowerCase().includes(value)))}
function categories(){return `<div class="card">${draft.categories.map((c,i)=>`<div class="formrow"><h3>${esc(cat(c.id))}</h3>${field('封面圖片 / Cover image',`<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="uploadCover('${c.id}',this)"><p class="help">PNG、JPG、WebP、GIF · 最多 10 MB / Up to 10 MB. 建議 16:9 / Recommended 16:9.</p><div id="cover-preview-${c.id}">${c.cover?`<img class="image-preview" style="width:300px;aspect-ratio:16/9;object-fit:cover;padding:0" src="${esc(c.cover)}" alt="">`:''}</div><div class="actions"><button onclick="clearCover('${c.id}')">${lang==='zh'?'移除封面':'Remove cover'}</button></div>`)}${field('圖示 / Icon',textInput('categories.'+i+'.icon',c.icon))}${toggle('categories.'+i+'.enabled',c.enabled)}<div class="actions"><button onclick="moveCategory(${i},-1)" ${i===0?'disabled':''}>${l('up')}</button><button onclick="moveCategory(${i},1)" ${i===3?'disabled':''}>${l('down')}</button></div></div>`).join('')}</div>`}
function clearCover(id){const c=draft.categories.find(c=>c.id===id);c.cover='';dirty=true;render();status(l('changes'))}
async function uploadCover(id,input){const file=input.files[0];if(!file)return;if(file.size>10*1024*1024){status(lang==='zh'?'圖片不可超過 10 MB':'Image must be under 10 MB',true);input.value='';return}input.disabled=true;status(lang==='zh'?'正在上傳封面…':'Uploading cover…');try{const body=new FormData();body.append('file',file);const r=await fetch('/api/covers',{method:'POST',body});const d=await r.json();if(!r.ok)throw new Error(d.error);const c=draft.categories.find(c=>c.id===id);c.cover=d.url;dirty=true;if(tab==='categories')render();status(lang==='zh'?'封面已上傳，儲存草稿或發佈後生效':'Cover uploaded. Save draft or publish to apply.')}catch(e){status(e.message,true)}finally{input.disabled=false;input.value=''}}
function moveCategory(i,step){const j=i+step;if(j<0||j>3)return;[draft.categories[i],draft.categories[j]]=[draft.categories[j],draft.categories[i]];draft.categories.forEach((c,k)=>c.order=k);dirty=true;render();status(l('changes'))}
function items(){return `<div class="card"><button onclick="addItem()">${l('add')}</button>${draft.items.map((item,i)=>`<div class="formrow"><div class="toolbar"><h3>${esc(item.title[lang]||item.id)}</h3><button onclick="deleteItem(${i})">${l('remove')}</button></div><div class="grid">${field(l('category'),`<select onchange="set('items.${i}.category',this.value);if(this.value==='ticket')set('items.${i}.mode','tickets');render()">${['airport','ticket'].map(v=>`<option value="${v}" ${v===item.category?'selected':''}>${esc(cat(v))}</option>`).join('')}</select>`)}${field('所需積分 / Points',textInput('items.'+i+'.points',item.points,'number'))}${field('名稱 · 粵語',textInput('items.'+i+'.title.zh',item.title.zh))}${field('Name · English',textInput('items.'+i+'.title.en',item.title.en))}${field('說明 · 粵語',area('items.'+i+'.description.zh',item.description.zh))}${field('Description · English',area('items.'+i+'.description.en',item.description.en))}</div>${item.category==='ticket'?field('門票／折扣 / Ticket or discount',`<select onchange="set('items.${i}.mode',this.value)"><option value="tickets" ${item.mode==='tickets'?'selected':''}>門票 / Tickets</option><option value="discount" ${item.mode==='discount'?'selected':''}>折扣 / Discount</option></select>`):''}${toggle('items.'+i+'.enabled',item.enabled)}</div>`).join('')}</div>`}
function addItem(){draft.items.push({id:crypto.randomUUID(),category:'airport',title:{zh:'新項目',en:'New reward'},description:{zh:'',en:''},points:1000,enabled:true});dirty=true;render();status(l('changes'))}
function deleteItem(i){draft.items.splice(i,1);dirty=true;render();status(l('changes'))}
let fieldCategory='tree';
function fields(){return `<div class="card"><div class="toolbar"><select style="width:200px" onchange="fieldCategory=this.value;render()">${draft.categories.map(c=>`<option value="${c.id}" ${c.id===fieldCategory?'selected':''}>${esc(cat(c.id))}</option>`).join('')}</select><button onclick="addField()">${l('add')}</button></div><p class="help">${lang==='zh'?'姓名及聯絡資料取自 Donor Profile；其餘兌換欄位可修改。':'Name and contact details come from the Donor Profile. Other reward fields can be edited.'}</p>${draft.fields[fieldCategory].map((f,i)=>{const path='fields.'+fieldCategory+'.'+i;return `<div class="formrow"><div class="actions"><button onclick="moveField(${i},-1)">${l('up')}</button><button onclick="moveField(${i},1)">${l('down')}</button><button onclick="deleteField(${i})">${l('remove')}</button></div><div class="grid">${field('欄位 ID / Field ID',textInput(path+'.key',f.key))}${field('類型 / Type',`<select onchange="set('${path}.type',this.value);if(this.value==='select'&&!draft.fields[fieldCategory][${i}].options)set('${path}.options',[{zh:'選項',en:'Option'}]);render()">${['text','textarea','select','number','date','email'].map(v=>`<option value="${v}" ${f.type===v?'selected':''}>${v}</option>`).join('')}</select>`)}${field('標籤 · 粵語',textInput(path+'.label.zh',f.label.zh))}${field('Label · English',textInput(path+'.label.en',f.label.en))}${field('字數上限 / Character limit',textInput(path+'.maxLength',f.maxLength??2000,'number'))}${f.type==='number'?field('最小值 / Minimum',textInput(path+'.min',f.min??0,'number'))+field('最大值 / Maximum',textInput(path+'.max',f.max??10000,'number')):''}</div><label class="switch"><input type="checkbox" ${f.required?'checked':''} onchange="set('${path}.required',this.checked)">${l('required')}</label>${f.type==='select'?`<div class="grid">${field('選項 · 粵語（每行一項）',`<textarea oninput="updateOptions(${i},'zh',this.value)">${esc(f.options.map(o=>o.zh).join('\n'))}</textarea>`)}${field('Options · English (one per line)',`<textarea oninput="updateOptions(${i},'en',this.value)">${esc(f.options.map(o=>o.en).join('\n'))}</textarea>`)}</div>`:''}</div>`}).join('')}</div>`}
function addField(){draft.fields[fieldCategory].push({key:'field'+Date.now(),label:{zh:'新欄位',en:'New field'},type:'text',required:false,maxLength:200});dirty=true;render();status(l('changes'))}
function deleteField(i){draft.fields[fieldCategory].splice(i,1);dirty=true;render();status(l('changes'))}
function moveField(i,step){const f=draft.fields[fieldCategory],j=i+step;if(j<0||j>=f.length)return;[f[i],f[j]]=[f[j],f[i]];dirty=true;render();status(l('changes'))}
function updateOptions(i,language,value){const f=draft.fields[fieldCategory][i],lines=value.split('\n'),other=language==='zh'?'en':'zh';f.options=lines.map((v,k)=>({[language]:v,[other]:f.options[k]?.[other]??v}));dirty=true;status(l('changes'))}
async function save(action){status(l('saving'));$('#actions').querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:draft,revision,action})});const d=await r.json();if(!r.ok)throw new Error(d.error);revision=d.revision;dirty=false;if(action==='publish'){published=structuredClone(draft);parent.postMessage({type:'content-published'},location.origin)}status(l(action==='publish'?'live':'saved'));render();return true}catch(e){status(e.message,true);return false}finally{$('#actions').querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function preview(){const win=window.open('about:blank','donor-preview');if(await save('draft')){if(win)win.location.href='/?preview=1';else location.href='/?preview=1'}else win?.close()}
async function loadRequests(){status(l('loading'));try{const r=await fetch('/api/requests?offset='+page*50);const d=await r.json();if(!r.ok)throw new Error(d.error);requests=d.requests;hasMore=d.hasMore;render();status('')}catch(e){status(e.message,true)}}
function requestTable(){return `<div class="notice">${lang==='zh'?'此列表含不同裝置提交的申請。姓名和電郵由填表者提供，尚未核實捐款者身份或積分資格。':'This list includes requests submitted across devices. Names and emails are supplied by visitors; donor identity and point eligibility are not verified.'}</div><div class="card tablewrap"><table><thead><tr><th>${l('customer')}</th><th>${l('category')}</th><th>${l('time')}</th><th>${l('detail')}</th><th>${l('status')}</th></tr></thead><tbody>${requests.length?requests.map(r=>`<tr><td>${esc(r.name)}<br><span class="small">${esc(r.email)}</span></td><td>${esc(cat(r.category))}</td><td>${new Date(r.submitted_at).toLocaleString(lang==='zh'?'zh-HK':'en-GB')}</td><td><details><summary>${l('detail')}</summary><dl>${Object.values(r.fields).map(f=>`<dt>${esc(f.label[lang])}</dt><dd>${esc(typeof f.value==='object'?f.value[lang]:f.value)}</dd>`).join('')}</dl></details></td><td><select onchange="setRequestStatus('${r.id}',this.value)">${['pending','complete'].map(v=>`<option value="${v}" ${r.status===v?'selected':''}>${l(v)}</option>`).join('')}</select></td></tr>`).join(''):`<tr><td colspan="5">${lang==='zh'?'暫無申請':'No requests yet'}</td></tr>`}</tbody></table><div class="pager"><button onclick="page--;loadRequests()" ${page===0?'disabled':''}>${l('previous')}</button><span>${page+1}</span><button onclick="page++;loadRequests()" ${!hasMore?'disabled':''}>${l('next')}</button></div></div>`}
async function setRequestStatus(id,value){try{const r=await fetch('/api/requests',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:value})});if(!r.ok)throw new Error('Unable to update');status(l('saved'))}catch(e){status(e.message,true);loadRequests()}}
async function exportCSV(){try{let all=[],offset=0;for(;;){const r=await fetch('/api/requests?offset='+offset);const d=await r.json();if(!r.ok)throw new Error(d.error);all.push(...d.requests);if(!d.hasMore)break;offset+=50}const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const rows=[['ID','Name','Email','Category','Submitted','Status','Fields'],...all.map(r=>[r.id,r.name,r.email,r.category,r.submitted_at,r.status,JSON.stringify(r.fields)])];const blob=new Blob(['\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='donor-requests.csv';a.click();URL.revokeObjectURL(url)}catch(e){status(e.message,true)}}
let donorRows=[],donorPage=0,donorMore=false,donorSearch='',selectedDonor=null,donorDirty=false,donorBusy=false,importCsvText='';
const dl=(zh,en)=>lang==='zh'?zh:en;
function donorActions(){return `<button onclick="downloadDonorTemplate()">${dl('CSV 範本','CSV template')}</button><button onclick="document.querySelector('#donor-csv-file').click()">Import CSV</button><input hidden id="donor-csv-file" type="file" accept=".csv,text/csv" onchange="previewDonorCsv(this)"><button class="primary" onclick="editDonor()">＋ ${dl('新增','Add')}</button>`}
function donorAvatar(d){return d.photoUrl?`<img class="donor-avatar" src="${esc(d.photoUrl)}" alt="${esc(d.englishName)}">`:`<span class="donor-avatar donor-initial" aria-hidden="true">${esc((d.englishName||'?').slice(0,1))}</span>`}
function donorsView(){return `<div class="donors-area" id="donors-area">${selectedDonor?donorProfileEditor():`<div class="card"><label for="donor-search">${dl('搜尋姓名、電話或電郵','Search name, phone or email')}</label><input id="donor-search" value="${esc(donorSearch)}" placeholder="${dl('搜尋 Donor','Search donors')}" oninput="searchDonors(this.value)"></div><div id="donor-list">${donorList()}</div>`}</div><dialog id="donor-import-dialog"><div class="card"><h3>${dl('匯入預覽','Import preview')}</h3><div id="donor-import-preview"></div><p class="help">${dl('相同電郵會更新既有資料，並保留照片。照片可在個人 Profile 上傳。','Matching emails update existing donors and keep their photos. Upload photos in each profile.')}</p><p id="donor-import-error" class="status error" role="alert"></p><div class="actions"><button onclick="document.querySelector('#donor-import-dialog').close()">${dl('取消','Cancel')}</button><button class="primary" id="donor-import-confirm" onclick="importDonors()">${dl('確認匯入','Confirm import')}</button></div></div></dialog>`}
function donorList(){return `<div class="donor-list-head"><span>${dl('姓名','Name')}</span><span>${dl('中文姓名','Chinese name')}</span><span>Phone</span><span>Email</span><span></span><span>Demo Points</span></div>${donorRows.length?donorRows.map(d=>`<div class="donor-row">${donorAvatar(d)}<button class="donor-name" onclick="editDonor('${d.id}')">${esc(d.prefix)} ${esc(d.englishName)}</button><span class="donor-chinese">${esc(d.chineseName)||'—'}</span><span class="donor-phone">${esc(d.phone)||'—'}</span><span class="donor-email">${esc(d.email)}</span><div class="actions"><button onclick="editDonor('${d.id}')">${dl('編輯','Edit')}</button><button class="donor-delete" onclick="deleteDonor('${d.id}')">${dl('刪除','Delete')}</button></div><button class="donor-points-link" onclick="openDonorPoints('${d.id}')">${d.demoPoints.toLocaleString()}</button></div>`).join(''):`<div class="empty card">${dl('暫無 Donor，請匯入 CSV 或新增。','No donors. Import a CSV or add a donor.')}</div>`}<div class="pager"><button onclick="donorPage--;loadDonors()" ${donorPage===0?'disabled':''}>${l('previous')}</button><span>${donorPage+1}</span><button onclick="donorPage++;loadDonors()" ${!donorMore?'disabled':''}>${l('next')}</button></div>`}
function donorProfileEditor(){const d=selectedDonor;const input=(key,type='text',required=false,max=150)=>`<input name="${key}" type="${type}" value="${esc(d[key])}" maxlength="${max}" ${required?'required':''} oninput="selectedDonor.${key}=this.value;donorDirty=true;status(l('changes'))">`;return `<button onclick="backToDonors()">‹ ${dl('返回 Donors Management','Back to Donors Management')}</button><div class="card donor-profile-editor"><div class="donor-profile-heading">${donorAvatar(d)}<div><h3>${d.id?esc(d.englishName):dl('新增 Donor','Add donor')}</h3><p class="help">${dl('儲存後即同步到該 Donor 的 Profile。','Saving synchronises this donor’s profile.')}</p></div></div><form id="donor-profile-form" onsubmit="event.preventDefault();saveDonor()"><div class="donor-profile-row donor-profile-first">${field('Prefix',input('prefix','text',false,40))}${field('English Full Name *',input('englishName','text',true))}${field('Chinese Full Name '+dl('（選填）','(optional)'),input('chineseName','text',false,100))}</div><div class="donor-profile-row">${field('Phone',input('phone','tel',false,50))}${field('Email *',input('email','email',true,180))}</div><div class="actions"><button type="submit" class="primary" ${donorBusy?'disabled':''}>${dl('儲存並同步','Save & sync')}</button>${d.id?`<button type="button" class="donor-delete" onclick="deleteDonor('${d.id}')">${dl('刪除 Donor','Delete donor')}</button>`:''}</div></form>${d.id?`<div class="donor-points-section"><label>Demo Points</label><button type="button" class="donor-points-link" onclick="openDonorPoints('${d.id}')">${d.demoPoints.toLocaleString()}</button><button type="button" onclick="openDonorPoints('${d.id}')">＋ ${dl('增加積分','Add points')}</button></div>`:''}${d.id?`<div class="donor-photo-upload"><button type="button" onclick="provisionDonorLogin('${d.id}')">${dl('建立／重設登入密碼','Create / reset login password')}</button><p class="help">${dl('產生臨時密碼供你交給此 Donor，不會自動發送電郵。','Generate a temporary password to give to this donor. No email is sent automatically.')}</p></div>`:''}<div class="donor-photo-upload"><label for="donor-photo">${dl('照片 · PNG／JPG','Photo · PNG / JPG')}</label><input id="donor-photo" type="file" accept="image/png,image/jpeg" onchange="uploadDonorPhoto(this)" ${!d.id||donorBusy?'disabled':''}><p class="help">${d.id?dl('最多 10 MB，照片只供本人及管理者查看。','Up to 10 MB. Photos are visible to the donor and administrators.'):dl('先儲存 Donor，再上傳照片。','Save the donor before uploading a photo.')}</p></div></div>`}
let donorSearchTimer;function searchDonors(value){donorSearch=value;donorPage=0;clearTimeout(donorSearchTimer);donorSearchTimer=setTimeout(loadDonors,250)}
async function loadDonors(){if(tab!=='donors'||donorBusy)return;const search=donorSearch,offset=donorPage*50;try{const r=await fetch('/api/donors?offset='+offset+'&search='+encodeURIComponent(search));const d=await r.json();if(!r.ok)throw new Error(d.error);if(search!==donorSearch||offset!==donorPage*50||tab!=='donors')return;donorRows=d.donors;donorMore=d.hasMore;const list=$('#donor-list');if(list)list.innerHTML=donorList()}catch(e){status(e.message,true)}}
async function editDonor(id){if(donorDirty&&!confirm(dl('放棄未儲存的修改？','Discard unsaved changes?')))return;try{if(id){const r=await fetch('/api/donors?id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=d.donor}else selectedDonor={prefix:'',englishName:'',chineseName:'',phone:'',email:'',photoUrl:null};donorDirty=false;render();status('')}catch(e){status(e.message,true)}}
function backToDonors(){if(donorDirty&&!confirm(dl('放棄未儲存的修改？','Discard unsaved changes?')))return;selectedDonor=null;donorDirty=false;render();loadDonors();status('')}
async function saveDonor(){const form=$('#donor-profile-form');if(!form||!form.reportValidity()||donorBusy)return false;donorBusy=true;status(l('saving'));form.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/donors',{method:selectedDonor.id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(selectedDonor)}),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=d.donor;donorDirty=false;donorBusy=false;render();status(dl('Profile 已儲存並同步。','Profile saved and synchronised.'));return true}catch(e){status(e.message,true);return false}finally{donorBusy=false;form.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function deleteDonor(id){if(donorBusy)return;let donor=selectedDonor?.id===id?selectedDonor:donorRows.find(d=>d.id===id);if(!donor||!confirm(dl('確定刪除此 Donor？','Delete this donor?')+'\n'+donor.englishName+'\n'+donor.email))return;donorBusy=true;try{const r=await fetch('/api/donors',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,revision:donor.revision})}),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=null;donorDirty=false;donorBusy=false;render();await loadDonors();status(dl('Donor 已刪除。','Donor deleted.'))}catch(e){status(e.message,true)}finally{donorBusy=false}}
async function uploadDonorPhoto(input){const file=input.files[0];if(!file||!selectedDonor?.id)return;if(file.size>10*1024*1024){status(dl('照片不可超過 10 MB','Photo exceeds 10 MB'),true);input.value='';return}if(donorDirty&&!await saveDonor()){input.value='';return}donorBusy=true;input.disabled=true;status(dl('正在上傳照片…','Uploading photo…'));try{const body=new FormData();body.append('file',file);body.append('id',selectedDonor.id);body.append('revision',selectedDonor.revision);const r=await fetch('/api/donors/photo',{method:'POST',body}),d=await r.json();if(!r.ok)throw new Error(d.error);selectedDonor=d.donor;donorBusy=false;render();status(dl('照片已儲存並同步。','Photo saved and synchronised.'))}catch(e){status(e.message,true)}finally{donorBusy=false;input.disabled=false;input.value=''}}
function downloadDonorTemplate(){const blob=new Blob(['\uFEFFPrefix,English Full Name,Chinese Full Name,Phone,Email\r\n'],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='donors-import-template.csv';a.click();URL.revokeObjectURL(url)}
async function previewDonorCsv(input){const file=input.files[0];input.value='';if(!file)return;if(file.size>2*1024*1024){status(dl('CSV 不可超過 2 MB','CSV exceeds 2 MB'),true);return}status(dl('檢查 CSV 中…','Checking CSV…'));try{importCsvText=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());const r=await fetch('/api/donors/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:importCsvText,action:'preview'})}),d=await r.json();if(!r.ok)throw new Error(d.error);$('#donor-import-preview').innerHTML=`<p>${dl('新增','Add')}: <b>${d.added}</b> · ${dl('更新','Update')}: <b>${d.updated}</b> · ${dl('總共','Total')}: <b>${d.total}</b></p><div class="tablewrap"><table><tr><th>English Full Name</th><th>Chinese Full Name</th><th>Phone</th><th>Email</th></tr>${d.preview.map(x=>`<tr><td>${esc(x.prefix)} ${esc(x.englishName)}</td><td>${esc(x.chineseName)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td></tr>`).join('')}</table></div>`;$('#donor-import-error').textContent='';$('#donor-import-dialog').showModal();status('')}catch(e){status(e.message,true)}}
async function importDonors(){const button=$('#donor-import-confirm');button.disabled=true;try{const r=await fetch('/api/donors/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:importCsvText,action:'import'})}),d=await r.json();if(!r.ok)throw new Error(d.error);$('#donor-import-dialog').close();importCsvText='';selectedDonor=null;donorDirty=false;donorPage=0;render();await loadDonors();status(dl('匯入完成：','Import complete: ')+d.added+dl(' 人新增，',' added, ')+d.updated+dl(' 人更新。',' updated.'))}catch(e){$('#donor-import-error').textContent=e.message}finally{button.disabled=false}}
async function syncDonors(){if(tab!=='donors'||document.hidden||donorBusy)return;if(!selectedDonor){loadDonors();return}if(!selectedDonor.id||donorDirty)return;try{const r=await fetch('/api/donors?id='+selectedDonor.id),d=await r.json();if(r.ok&&d.donor.revision!==selectedDonor.revision){selectedDonor=d.donor;render()}else if(r.status===404){selectedDonor=null;render();loadDonors()}}catch(e){}}
setInterval(syncDonors,10000);

let donorPointsId='',donorPointsOffset=0,pointOperationId=null,pointSaving=false;
async function openDonorPoints(id,offset=0){if(donorDirty&&!await saveDonor())return;if(donorPointsId!==id)pointOperationId=null;donorPointsId=id;donorPointsOffset=offset;let dialog=$('#donor-points-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='donor-points-dialog';document.body.append(dialog)}dialog.innerHTML=`<div class="point-dialog-head"><h3>Demo Points</h3><button onclick="document.querySelector('#donor-points-dialog').close()">×</button></div><div id="donor-points-content">${l('loading')}</div>`;if(!dialog.open)dialog.showModal();try{const r=await fetch('/api/donors/points?id='+id+'&offset='+offset),d=await r.json();if(!r.ok)throw new Error(d.error);if(selectedDonor?.id===id&&!donorDirty){selectedDonor=d.donor;const area=$('#donors-area');if(area)area.innerHTML=donorProfileEditor()}$('#donor-points-content').innerHTML=`<p>${esc(d.donor.englishName)}</p><p class="point-total">${d.donor.demoPoints.toLocaleString()}</p><div class="point-history">${d.entries.length?d.entries.map(e=>`<div><span>${new Date(e.created_at).toLocaleString(lang==='zh'?'zh-HK':'en-GB',{timeZone:'Asia/Hong_Kong'})}</span><span>${e.kind==='add'?dl('加分','Added'):dl('種樹兌換','Tree redemption')}</span><strong>${e.amount>0?'+':''}${e.amount.toLocaleString()}</strong></div>`).join(''):`<p>${dl('暫無積分記錄','No points history yet')}</p>`}</div><div class="pager"><button onclick="openDonorPoints('${id}',${Math.max(0,offset-50)})" ${offset===0?'disabled':''}>‹</button><button onclick="openDonorPoints('${id}',${offset+50})" ${!d.hasMore?'disabled':''}>›</button></div><form class="point-add-form" onsubmit="event.preventDefault();addDonorPoints(this)"><label>${dl('增加積分','Add points')}</label><input type="number" name="amount" min="1" max="10000000" step="1" required oninput="pointOperationId=null"><p id="point-error" role="alert" class="status error"></p><button type="submit" class="primary">＋ ${dl('確認增加','Add points')}</button></form>`}catch(e){$('#donor-points-content').textContent=e.message}}
async function addDonorPoints(form){if(pointSaving)return;pointSaving=true;const button=form.querySelector('button');button.disabled=true;pointOperationId??=crypto.randomUUID();try{const r=await fetch('/api/donors/points',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({donorId:donorPointsId,amount:Number(form.amount.value),entryId:pointOperationId})}),d=await r.json();if(!r.ok)throw new Error(d.error);pointOperationId=null;if(selectedDonor?.id===donorPointsId){selectedDonor=d.donor;const area=$('#donors-area');if(area)area.innerHTML=donorProfileEditor()}else await loadDonors();await openDonorPoints(donorPointsId);status(dl('積分已增加並同步。','Points added and synchronised.'))}catch(e){$('#point-error').textContent=e.message}finally{pointSaving=false;button.disabled=false}}
async function provisionDonorLogin(id){if(!confirm(dl('建立或重設此 Donor 的登入密碼？','Create or reset this donor’s login password?')))return;try{const r=await fetch('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({donorId:id})}),d=await r.json();if(!r.ok)throw new Error(d.error);let box=document.querySelector('#account-password-dialog');if(!box){box=document.createElement('dialog');box.id='account-password-dialog';box.style.cssText='max-width:90vw;padding:28px;border-radius:12px;background:#faf7e8';document.body.append(box)}box.innerHTML=`<h3>${dl('登入資料','Login details')}</h3><p>${esc(d.email)}</p><p><code>${esc(d.password)}</code></p><p>${dl('此密碼只在此顯示，請妥善保存並交給 Donor。','Save this password and provide it to the donor.')}</p><button onclick="this.closest('dialog').close()">${dl('關閉','Close')}</button>`;box.showModal()}catch(e){status(e.message,true)}}
window.hasUnsavedChanges=()=>dirty||donorDirty||donorBusy;const requestedLang=new URLSearchParams(location.search).get('lang');if(['zh','en'].includes(requestedLang))lang=requestedLang;if(!['overview','appearance','text','categories','items','fields','requests','donors'].includes(tab))tab='overview';
window.addEventListener('beforeunload',e=>{if(dirty||donorDirty){e.preventDefault();e.returnValue=''}});load();
</script></body></html>
